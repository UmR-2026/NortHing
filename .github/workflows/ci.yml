name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'png/**'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'png/**'

# Cancel previous runs on same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Rust: build check ─────────────────────────────────────────────
  rust-build-check:
    name: Rust Build Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        # Windows-only per user decision 2026-09-05; non-Windows builds currently broken (terminal-core E0624), see tech-debt-ledger
        os:
          - windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup OpenSSL (Windows, prebuilt)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci/setup-openssl-windows.ps1

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          shared-key: "ci-check-v2-${{ runner.os }}-no-cargo-bin-v1"
          cache-bin: false
          # PR caches are scoped to merge refs; main pushes own shared cache refreshes.
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Generate i18n locale contract
        shell: bash
        run: |
          node scripts/generate-i18n-contract.mjs
          test ! -d northhing-Installer && test -f northing-installer/src/i18n/generatedLocaleContract.ts
        # generated_locale_contract.rs is gitignored; northhing-core fails E0583 without it

      - name: Check compilation
        run: cargo check --workspace

      - name: Run workspace Rust tests
        if: matrix.os == 'windows-latest'
        run: cargo test --locked --workspace

  # ── Rust: serial tests ────────────────────────────────────────────
  rust-tests-serial:
    name: Rust Tests Serial (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup OpenSSL (Windows, prebuilt)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci/setup-openssl-windows.ps1

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          shared-key: "ci-check-v2-${{ runner.os }}-no-cargo-bin-v1"
          cache-bin: false
          # PR caches are scoped to merge refs; main pushes own shared cache refreshes.
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Generate i18n locale contract
        shell: bash
        run: |
          node scripts/generate-i18n-contract.mjs
          test ! -d northhing-Installer && test -f northing-installer/src/i18n/generatedLocaleContract.ts
        # generated_locale_contract.rs is gitignored; northhing-core fails E0583 without it

      - name: Run workspace Rust tests (serial)
        run: cargo test --locked --workspace -- --test-threads=1

  # ── kernel-api dependency guard ─────────────────────────────────────
  kernel-api-clean:
    name: kernel-api dep guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Check prohibited deps in kernel-api
        run: |
          # kernel-api must not depend on rmcp, git2, axum, tower-http, reqwest, or northhing-core
          DEPS=$(cargo tree -p northhing-kernel-api 2>/dev/null)
          # Third-party prohibited deps: substring match is safe
          for crate in rmcp git2 axum tower-http reqwest; do
            if echo "$DEPS" | grep -q "$crate"; then
              echo "ERROR: kernel-api depends on prohibited crate: $crate"
              exit 1
            fi
          done
          # northhing-core: use word-boundary match to avoid false positive on northhing-core-types
          if echo "$DEPS" | grep -qE '(^|[^a-z0-9_-])northhing-core($|[^a-z0-9_-])'; then
            echo "ERROR: kernel-api depends on prohibited crate: northhing-core"
            exit 1
          fi
          echo "kernel-api dependency guard passed"

  # ── core boundary check ────────────────────────────────────────────
  core-boundaries:
    name: core boundary check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run core boundary checker
        run: node scripts/check-core-boundaries.mjs

  # ── rot budget check ───────────────────────────────────────────────
  rot-budget:
    name: rot budget check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run rot budget checker and self-tests
        run: node scripts/verify-rot-budget.test.mjs && node scripts/verify-rot-budget.mjs

  # ── repo hygiene check ─────────────────────────────────────────────
  repo-hygiene:
    name: repo hygiene check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run repo hygiene checker
        run: node scripts/check-repo-hygiene.mjs

  # ── i18n contract check ────────────────────────────────────────────
  i18n-contract:
    name: i18n contract check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Observation slot: 24 pre-existing failures belong to frozen T2-3 surface, convert to hard gate when unfrozen
      - name: Run i18n contract test
        continue-on-error: true
        run: pnpm run i18n:contract:test:ci


