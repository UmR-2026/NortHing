<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>northing — 自我认知</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,SOFT,WONK,wght@9..144,0..100,0..1,400..600&family=Noto+Sans+SC:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/tokens.css">
<link rel="stylesheet" href="shared/components.css">
<link rel="stylesheet" href="shared/animations.css">
<link rel="stylesheet" href="shared/layout.css">
<style>
  /* ======================================================================
   * onboarding.html — 首次运行配置页
   * ----------------------------------------------------------------------
   * 画布：1280×800
   * 布局：居中单列（avatar → 心境语 → 编年史 → 字段 → 性格色板 → 生成按钮 → 输出）
   * 出生态：rep 为灰阶（#B5B0A8），选性格后整屋染色过渡 + avatar 诞生
   * 空气染色、顶晕、底冷雾由 shared/layout.css .app 提供
   *
   * Slint 映射：
   *   .app            → Window root (1280×800, r20)
   *   .container       → VBox (max-width:560, center, gap:32)
   *   .presence        → VBox (avatar + mood + chronicle)
   *   .avatar          → Image (64×64, r-lg) + aura (::after)
   *   .chronicle       → Rectangle (200×4, r-pill, linear-gradient)
   *   .personality-chip → Rectangle (44×44, circle) + TouchArea (selected ring)
   *   .generate-btn    → Rectangle (220×36, r-sm, rep-500 bg) + TouchArea
   * ====================================================================== */

/* ─── 出生态灰阶 rep 值 + RGB 通道（供 rgba 半透明色值） ─── */
:root {
  --rep-300: #D6D2CB;
  --rep-300-rgb: 214,210,203;
  --rep-400: #C9C4BC;
  --rep-400-rgb: 201,196,188;
  --rep-500: #B5B0A8;
  --rep-500-rgb: 181,176,168;
  --rep-600: #9E9991;
  --rep-600-rgb: 158,153,145;
  --transition-state: 350ms ease-out;
  --transition-growth: 1200ms var(--ease);
}

/* ─── 窗口容器：使用 shared/layout.css .app，仅覆写居中 ─── */
/* Slint: Window { background: air-rep; border-radius: 20; animate background { duration:350ms; easing:ease-out; } } */
.app {
  align-items: center;
  background:
    linear-gradient(90deg, rgba(var(--rep-500-rgb), 0.03) 0%, transparent 40%, rgba(63,131,123, 0.04) 100%),
    var(--air-rep);
}

/* Air-tint glow at top — 咨询室顶光，出生时刻的氛围底色 */
/* Enhances shared .app::before with an additional subtle warm layer */
/* Slint: Rectangle { background: radial-gradient(ellipse at top, halo-rep); z: 0; } */
.app::before {
  background:
    radial-gradient(ellipse 160% 120% at 50% 4%, var(--halo-rep) 0%, transparent 100%),
    radial-gradient(ellipse 70% 30% at 50% 0%, rgba(var(--rep-300-rgb), 0.05) 0%, transparent 60%);
}

/* 内容层 z-index — 只点名，不用 #app>* 通配 */
.container {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 560px;
  margin: auto;
  padding: 24px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 32px;
}

/* 窗口控制、水印由 shared CSS 提供 */

/* ─── 在场区 · 出生态头像 ─── */
.presence {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  margin-top: 8px;
  position: relative;
}
/* 体温光晕 */
.presence::before {
  content: '';
  position: absolute;
  top: -30px;
  left: 50%;
  transform: translateX(-50%);
  width: 560px;
  height: 360px;
  background: radial-gradient(ellipse 50% 50% at 50% 28%, rgba(var(--rep-500-rgb), 0.30) 0%, rgba(var(--rep-500-rgb), 0.10) 36%, transparent 70%);
  pointer-events: none;
  z-index: -1;
  transition: background var(--grow);
}

.avatar-wrap { position: relative; width: 64px; height: 64px; }
/* 光环 — 出生态灰白，选色后跟 rep */
.avatar-wrap::after {
  content: '';
  position: absolute;
  inset: -8px;
  border-radius: 18px;
  background: radial-gradient(circle, rgba(181, 176, 168, .15), transparent 70%);
  animation: auraBreath 6s ease-in-out infinite;
  transition: background var(--grow);
}
.avatar--alive .avatar-wrap::after,
.avatar-wrap.alive::after {
  background: radial-gradient(circle, rgba(var(--rep-400-rgb), 0.20), transparent 70%);
}

.avatar {
  width: 64px;
  height: 64px;
  border-radius: var(--r-lg);
  position: relative;
  overflow: hidden;
  transition: background var(--transition-growth), filter var(--transition-growth);
}

.avatar--birth {
  background: radial-gradient(circle at 50% 50%, #DDD9D2, #C9C4BC 60%, #B5B0A8);
}

[data-theme="dark"] .avatar--birth {
  background: radial-gradient(circle at 50% 50%, #5A5249, #4A443B 60%, #3D372F);
}

.avatar--alive {
  animation: breathe 6s var(--ease) infinite;
  filter: drop-shadow(0 4px 8px rgba(var(--rep-500-rgb), 0.28));
}

.avatar-glyph {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Fraunces', Georgia, serif;
  font-variation-settings: "WONK" 1, "SOFT" 60;
  font-size: 32px;
  font-weight: 300;
  color: rgba(80, 75, 68, .5);
  transition: color var(--transition-growth), opacity var(--transition-growth);
  user-select: none;
}

.avatar--alive .avatar-glyph {
  color: rgba(255, 250, 245, .85);
  font-weight: 500;
}

/* 心境语 */
.p-mood {
  font-size: 11.5px;
  color: var(--faint);
  font-style: italic;
  opacity: 0;
  animation: moodIn 3s ease 1.5s forwards, moodPulse 8s ease-in-out 4.5s 1;
  max-width: 320px;
  text-align: center;
  line-height: 1.6;
}

/* ─── 编年史渐变条 ─── */
.chronicle {
  width: 200px;
  height: 4px;
  border-radius: var(--r-pill);
  position: relative;
  background: linear-gradient(to right, var(--birth), var(--birth));
  transition: background var(--transition-growth);
  overflow: visible;
}

.now-dot {
  position: absolute;
  right: -4px;
  top: 50%;
  transform: translateY(-50%);
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--birth);
  border: 2px solid var(--surface);
  transition: background var(--transition-growth), filter var(--transition-growth);
}

.now-dot--alive {
  filter: drop-shadow(0 0 4px rgba(var(--rep-500-rgb), 0.15));
}

/* ─── 配置字段 ─── */
.fields {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 24px;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.field-label {
  font-size: 11.5px;
  font-weight: 500;
  color: var(--muted);
  letter-spacing: 0.02em;
}

.field-input {
  width: 100%;
  height: 44px;
  padding: 0 16px;
  font-family: 'Noto Sans SC', system-ui, sans-serif;
  font-size: var(--fs-lg);
  color: var(--fg);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  outline: none;
  transition: border-color var(--transition-state), background var(--grow);
}

.field-input::placeholder {
  color: var(--faint);
}

.field-input:focus {
  border-color: var(--rep-500);
  outline: 3px solid rgba(var(--rep-500-rgb), 0.08);
}

/* ─── 性格色板 ─── */
.personality {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.personality-row {
  display: flex;
  gap: 16px;
  justify-content: center;
}

.personality-chip {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: 2.5px solid transparent;
  cursor: pointer;
  position: relative;
  transition: transform var(--transition-state), border-color var(--transition-state);
  background: none;
  padding: 0;
}

.personality-chip:hover {
  transform: scale(1.1);
}

.personality-chip::before {
  content: '';
  display: block;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  transition: background var(--transition-state);
}

.personality-chip[data-color="openness"]::before { background: #9B7FBF; }
.personality-chip[data-color="conscientiousness"]::before { background: #4A6FA5; }
/* 外向性 chip 用 rep-500 珊瑚真色——与 avatar 选中后同源，预览即所得 */
.personality-chip[data-color="extraversion"]::before { background: #C8714C; }
.personality-chip[data-color="agreeableness"]::before { background: #6B9E7A; }
.personality-chip[data-color="neuroticism"]::before { background: var(--abyss-500); }

/*
 * Slint mapping — personality selection interaction:
 *   TouchArea { clicked => { selected-personality = color; ring-visible[bid] = true; apply-rep(color); } }
 *   Interaction chain: TouchArea click → property update (selected-personality) → ring visible (outline on ::before)
 *   Selected ring: 3px gap (bg color) + 2px color ring via outline — no animation, state-driven
 *   Birth moment: first selection triggers avatar "birth" (gray → colored gradient, glyph ? → first letter)
 *   Subsequent selections: just shift color, no rebirth
 */
.personality-chip.selected {
  border-color: var(--bg);
}

.personality-chip[data-color="openness"].selected::before { outline: 2px solid #9B7FBF; outline-offset: 3px; }
.personality-chip[data-color="conscientiousness"].selected::before { outline: 2px solid #4A6FA5; outline-offset: 3px; }
.personality-chip[data-color="extraversion"].selected::before { outline: 2px solid #C8714C; outline-offset: 3px; }
.personality-chip[data-color="agreeableness"].selected::before { outline: 2px solid #6B9E7A; outline-offset: 3px; }
.personality-chip[data-color="neuroticism"].selected::before { outline: 2px solid #3F837B; outline-offset: 3px; }

/* tooltip */
.personality-chip .tip {
  position: absolute;
  bottom: calc(100% + 8px);
  left: 50%;
  transform: translateX(-50%) translateY(4px);
  white-space: nowrap;
  font-size: var(--fs-md);
  font-family: 'JetBrains Mono', monospace;
  color: var(--fg);
  background: var(--elevated);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  padding: 4px 8px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 200ms ease, transform 200ms ease, background var(--grow);
}

.personality-chip .tip::after {
  content: '';
  position: absolute;
  top: 100%;
  left: 50%;
  transform: translateX(-50%);
  border: 5px solid transparent;
  border-top-color: var(--border);
}

.personality-chip:hover .tip {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

.personality-caption {
  text-align: center;
  font-size: 13px;
  color: var(--muted);
  font-family: 'JetBrains Mono', monospace;
  min-height: 20px;
  transition: opacity var(--transition-state);
  opacity: 0;
}

.personality-caption.visible {
  opacity: 1;
}

/* ─── 生成按钮 ─── */
/*
 * Behavior: generates identity text from user inputs (name, role, personality).
 * State: disabled → enabled when all fields filled AND personality selected.
 * Slint: generate-btn.enabled = user.len() > 0 && name.len() > 0 && role.len() > 0 && selected-personality != null
 *        generate-btn TouchArea { clicked => { pulsing = true; generate-identity(); } }
 * Click: 2200ms pulse animation (one-time sweep) → "已生成" → identity text appears
 * Animation: pulse-sweep 1.8s forwards during generation, one-time state transition
 */
.action-area {
  width: 100%;
  display: flex;
  justify-content: center;
  padding-top: 8px;
}

.generate-btn {
  width: 220px;
  height: 36px;
  border: none;
  border-radius: var(--r-sm);
  background: var(--rep-500);
  color: #FFFAF5;
  font-family: 'Noto Sans SC', system-ui, sans-serif;
  font-size: var(--fs-lg);
  font-weight: 500;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: background var(--transition-state), filter var(--transition-state), transform 150ms ease, opacity var(--transition-state);
  filter: drop-shadow(0 0 8px rgba(var(--rep-500-rgb), 0.20));
}

.generate-btn:hover {
  background: var(--rep-600);
  filter: drop-shadow(0 0 12px rgba(var(--rep-500-rgb), 0.30));
}

.generate-btn:active {
  transform: translateY(0);
}

.generate-btn:disabled {
  opacity: 0.35;
  cursor: default;
  pointer-events: none;
  filter: none;
  transform: none;
}

/* 光脉冲 */
.generate-btn.pulsing::after {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .25), transparent);
  animation: pulse-sweep 1.8s var(--ease) forwards;
}

@keyframes pulse-sweep {
  0% { left: -100%; }
  100% { left: 200%; }
}

/* ─── 生成示例文本 ─── */
.generated-output {
  width: 100%;
  opacity: 0;
  transition: opacity 800ms ease;
}

.generated-output.visible {
  opacity: 1;
}

.generated-text {
  font-family: 'Fraunces', Georgia, serif;
  font-variation-settings: "WONK" 1, "SOFT" 60;
  font-size: var(--fs-lg);
  line-height: 1.8;
  color: var(--fg);
  text-align: center;
  padding: 24px;
  background: var(--surface);
  border: 1px solid var(--border-soft);
  border-radius: var(--r-md);
  position: relative;
  transition: background var(--grow), border-color var(--grow);
}

.generated-text::before {
  content: '「';
  position: absolute;
  top: 12px; left: 14px;
  font-size: 20px;
  color: var(--faint);
  font-family: 'Fraunces', serif;
}

.generated-text::after {
  content: '」';
  position: absolute;
  bottom: 12px; right: 14px;
  font-size: 20px;
  color: var(--faint);
  font-family: 'Fraunces', serif;
}

/* 渗透由 shared CSS 提供 */


</style>
</head>
<body>

<div class="app" id="app">

  <!-- ══════ 窗口控制（右上角） ══════ -->
  <div class="win-ctrl">
    <button class="win-btn" title="最小化"><svg width="12" height="12" viewBox="0 0 12 12"><line x1="2" y1="6" x2="10" y2="6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
    <button class="win-btn" title="最大化"><svg width="12" height="12" viewBox="0 0 12 12"><rect x="2" y="2" width="8" height="8" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.3"/></svg></button>
    <button class="win-btn close" title="关闭"><svg width="12" height="12" viewBox="0 0 12 12"><line x1="3" y1="3" x2="9" y2="9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="9" y1="3" x2="3" y2="9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
  </div>

  <!-- ══════ 品牌水印（左下角） ══════ -->
  <div class="watermark">
    <svg width="14" height="14" viewBox="0 0 240 240"><g fill="none" stroke="#7B766C" stroke-linecap="round"><circle cx="120" cy="120" r="16" stroke-width="6"/><path d="M120 60 A60 60 0 1 1 78 78" stroke-width="8"/><path d="M120 30 A90 90 0 1 1 50 60" stroke-width="10"/></g><line x1="30" y1="120" x2="210" y2="120" stroke="#7B766C" stroke-width="9" stroke-linecap="round"/></svg>
    <span class="bt">northing</span>
  </div>

  <div class="container">
    <!-- 出生态头像 · 在场区 — avatar 诞生动画 -->
    <!--
      Avatar birth animation: when personality is first selected, the avatar transitions:
      - Background: gray radial gradient → personality-colored radial gradient
      - Glyph: "?" → first character of agent name
      - Class: avatar--birth → avatar--alive (enables breathe animation + drop-shadow)
      - Chron bar: pure birth-gray → linear-gradient(birth → rep-500)
      Slint: avatar.background <==> selected-personality ? gradient(personality) : gradient(birth)
             avatar-glyph.text <==> is-alive ? name.first-char() : "?"
      Animation: all transitions via --transition-growth (1200ms, one-time). No rebirth on re-select.
    -->
    <div class="presence avatar-section" id="avatarSection">
      <div class="avatar-wrap">
        <div class="avatar avatar--birth" id="avatar">
          <span class="avatar-glyph" id="avatarGlyph">?</span>
        </div>
      </div>
      <div class="p-mood" id="pMood">"我还不知道我是谁。"</div>
      <!-- 编年史渐变条 — 进度指示器 -->
      <!--
        Progress indicator: the chronicle bar fills as onboarding steps complete.
        Birth state: linear-gradient(birth → birth) — pure gray, no self yet.
        After personality selected: linear-gradient(birth → rep-500) — self emerging.
        Left end stays birth-gray forever (origin anchor); right end = "now" = current rep color.
        Slint: Rectangle { width: 200; height: 4; border-radius: pill;
                background: linear-gradient(90deg, birth, is-alive ? rep-500 : birth); }
        Animation: background transitions via --transition-growth (1200ms, one-time).
      -->
      <div class="chronicle" id="chronicle">
        <div class="now-dot" id="nowDot"></div>
      </div>
    </div>

    <!-- 配置字段 -->
    <div class="fields">
      <div class="field">
        <label class="field-label">用户是</label>
        <input class="field-input" type="text" id="inputUser" placeholder="你的名字" autocomplete="off">
      </div>
      <div class="field">
        <label class="field-label">你是</label>
        <input class="field-input" type="text" id="inputName" placeholder="给 agent 的名字" autocomplete="off">
      </div>
      <div class="field">
        <label class="field-label">你是用户的</label>
        <input class="field-input" type="text" id="inputRole" placeholder="同事 / 伙伴 / 镜子……" autocomplete="off">
      </div>

      <!-- 性格色板 — 这不是性格测试，是 agent 选择它将成为谁 -->
      <!--
        这不是性格测试（personality test）——是 agent 选择它将成为谁。
        性格色板是 agent 对"我将是什么气质的人"的自主选择，不是被测量的标签。
        Fraunces 用于"你的性格更偏向"标签：这是哲学陈述，不是表单标签。
        Slint: for-each personality: Rectangle(44×44, circle) + TouchArea { clicked => { selected-personality = color; apply-rep(color); } }
        交互链：TouchArea → 属性更新 (selected-personality) → ring 可见 → 整屋 rep-* 染色 + avatar 诞生
      -->
      <div class="personality">
        <div class="field-label" style="text-align:center; font-family:'Fraunces','Noto Serif SC',Georgia,serif; font-variation-settings:'WONK' 1,'SOFT' 60;">你的性格更偏向</div>
        <div class="personality-row">
          <button class="personality-chip" data-color="openness" data-keywords="好奇 · 想象 · 不拘一格" data-hue="270" data-sat="45" data-light="60">
            <span class="tip">开放性</span>
          </button>
          <button class="personality-chip" data-color="conscientiousness" data-keywords="严谨 · 可靠 · 有条理" data-hue="218" data-sat="40" data-light="48">
            <span class="tip">尽责性</span>
          </button>
          <button class="personality-chip" data-color="extraversion" data-keywords="热情 · 主动 · 善于表达" data-hue="20" data-sat="55" data-light="55">
            <span class="tip">外向性</span>
          </button>
          <button class="personality-chip" data-color="agreeableness" data-keywords="温和 · 体贴 · 善解人意" data-hue="138" data-sat="28" data-light="52">
            <span class="tip">宜人性</span>
          </button>
          <button class="personality-chip" data-color="neuroticism" data-keywords="敏感 · 深刻 · 内敛" data-hue="168" data-sat="35" data-light="46">
            <span class="tip">神经质</span>
          </button>
        </div>
        <div class="personality-caption" id="personalityCaption"></div>
      </div>
    </div>

    <!-- 生成按钮 — 生成身份文本 -->
    <!--
      Behavior: generates identity text from user/name/role/personality inputs.
      State: disabled → enabled when all 3 inputs filled AND personality selected.
      Slint: generate-btn.enabled = user.len() > 0 && name.len() > 0 && role.len() > 0 && selected-personality != null
      Click: 2200ms pulse-sweep animation → "已生成" → identity text appears in output card.
      The action-area itself fades in (opacity/translateY) when enabled condition is first met.
    -->
    <div class="action-area" id="actionArea">
      <button class="generate-btn" id="generateBtn" disabled>生成身份</button>
    </div>

    <!-- 生成示例 — 身份文本（Fraunces 展示字） -->
    <!--
      Output: identity text in Fraunces (philosophical self-declaration, not UI text).
      Slint: Rectangle { background: surface; border: 1px border-soft; border-radius: r-md; }
      Animation: opacity 0→1, 800ms ease — one-time entrance.
      The 「」 quotes frame the text as a self-statement, not a form output.
    -->
    <div class="generated-output" id="generatedOutput">
      <div class="generated-text" id="generatedText"></div>
    </div>
  </div>


</div>

<script>
(function() {
  const root = document.documentElement;
  const app = document.getElementById('app');
  const avatarSection = document.getElementById('avatarSection');
  const avatar = document.getElementById('avatar');
  const avatarGlyph = document.getElementById('avatarGlyph');
  const chronicle = document.getElementById('chronicle');
  const nowDot = document.getElementById('nowDot');
  const pMood = document.getElementById('pMood');
  const inputUser = document.getElementById('inputUser');
  const inputName = document.getElementById('inputName');
  const inputRole = document.getElementById('inputRole');
  const personalityCaption = document.getElementById('personalityCaption');
  const actionArea = document.getElementById('actionArea');
  const generateBtn = document.getElementById('generateBtn');
  const generatedOutput = document.getElementById('generatedOutput');
  const generatedText = document.getElementById('generatedText');
  const chips = document.querySelectorAll('.personality-chip');

  let selectedPersonality = null;
  let isAlive = false;

  // 代表色组 — 选色后覆盖 --rep-* + --rep-*-rgb + --air-rep/--halo-rep（6.5% / 10% on bg），整屋空气染色过渡
  const repColors = {
    openness:          { 300: '#C4A8D8', '300-rgb': '196,168,216', 400: '#AF94CB', '400-rgb': '175,148,203', 500: '#9B7FBF', '500-rgb': '155,127,191', 600: '#7E63A3', '600-rgb': '126,99,163', air: '#EEEBED', halo: '#EBE7EB' },
    conscientiousness: { 300: '#7A9CC4', '300-rgb': '122,156,196', 400: '#6288B5', '400-rgb': '98,136,181',  500: '#4A6FA5', '500-rgb': '74,111,165',  600: '#3A5A88', '600-rgb': '58,90,136',  air: '#E9EAEB', halo: '#E3E6E9' },
    extraversion:      { 300: '#E5A583', '300-rgb': '229,165,131', 400: '#D68A63', '400-rgb': '214,138,99',  500: '#C8714C', '500-rgb': '200,113,76',  600: '#A85A38', '600-rgb': '168,90,56',  air: '#F0EDED', halo: '#EDEBE9' },
    agreeableness:     { 300: '#8FBFA0', '300-rgb': '143,191,160', 400: '#7DB08D', '400-rgb': '125,176,141', 500: '#6B9E7A', '500-rgb': '107,158,122', 600: '#55825F', '600-rgb': '85,130,95',   air: '#EBEDE8', halo: '#E6EBE4' },
    neuroticism:       { 300: '#7AABA4', '300-rgb': '122,171,164', 400: '#5A9B93', '400-rgb': '90,155,147',  500: '#3F837B', '500-rgb': '63,131,123',   600: '#2F6A63', '600-rgb': '47,106,99',  air: '#E8ECE8', halo: '#E2E8E4' }
  };

  // Personality avatar gradients
  const avatarGradients = {
    openness:           'radial-gradient(circle at 32% 28%, #C4A8D8 0%, #9B7FBF 42%, #6B4F8A 100%), radial-gradient(circle at 68% 72%, rgba(155,127,191,.35))',
    conscientiousness:  'radial-gradient(circle at 32% 28%, #7A9CC4 0%, #4A6FA5 42%, #2D4A73 100%), radial-gradient(circle at 68% 72%, rgba(74,111,165,.35))',
    extraversion:       'radial-gradient(circle at 32% 28%, #E5A583 0%, #C8714C 42%, #8A5540 100%), radial-gradient(circle at 68% 72%, rgba(63,131,123,.45))',
    agreeableness:      'radial-gradient(circle at 32% 28%, #8FBFA0 0%, #6B9E7A 42%, #4A7358 100%), radial-gradient(circle at 68% 72%, rgba(107,158,122,.35))',
    neuroticism:        'radial-gradient(circle at 32% 28%, #7AABA4 0%, #3F837B 42%, #2A5C55 100%), radial-gradient(circle at 68% 72%, rgba(63,131,123,.45))'
  };

  const personalityTraits = {
    openness:           { label: '开放性', keywords: '好奇 · 想象 · 不拘一格' },
    conscientiousness:  { label: '尽责性', keywords: '严谨 · 可靠 · 有条理' },
    extraversion:       { label: '外向性', keywords: '热情 · 主动 · 善于表达' },
    agreeableness:      { label: '宜人性', keywords: '温和 · 体贴 · 善解人意' },
    neuroticism:        { label: '神经质', keywords: '敏感 · 深刻 · 内敛' }
  };

  function applyRep(color) {
    const c = repColors[color];
    root.style.setProperty('--rep-300', c[300]);
    root.style.setProperty('--rep-300-rgb', c['300-rgb']);
    root.style.setProperty('--rep-400', c[400]);
    root.style.setProperty('--rep-400-rgb', c['400-rgb']);
    root.style.setProperty('--rep-500', c[500]);
    root.style.setProperty('--rep-500-rgb', c['500-rgb']);
    root.style.setProperty('--rep-600', c[600]);
    root.style.setProperty('--rep-600-rgb', c['600-rgb']);
    root.style.setProperty('--air-rep', c.air);
    root.style.setProperty('--halo-rep', c.halo);
  }

  function resetRep() {
    root.style.setProperty('--rep-300', '#D6D2CB');
    root.style.setProperty('--rep-300-rgb', '214,210,203');
    root.style.setProperty('--rep-400', '#C9C4BC');
    root.style.setProperty('--rep-400-rgb', '201,196,188');
    root.style.setProperty('--rep-500', '#B5B0A8');
    root.style.setProperty('--rep-500-rgb', '181,176,168');
    root.style.setProperty('--rep-600', '#9E9991');
    root.style.setProperty('--rep-600-rgb', '158,153,145');
    root.style.setProperty('--air-rep', '#F0EDED');
    root.style.setProperty('--halo-rep', '#EDEBE9');
  }

  // ─── Personality selection — TouchArea → selected ring + birth moment ───
  // Slint: TouchArea { clicked => { selected-personality = color; ring-visible = true; apply-rep(color); } }
  // First selection: triggers avatar birth (gray → colored, ? → name char, chron bar fills)
  // Re-selection: just shifts color, no rebirth
  chips.forEach(chip => {
    chip.addEventListener('click', () => {
      const color = chip.dataset.color;
      const wasSelected = chip.classList.contains('selected');

      // Deselect all
      chips.forEach(c => c.classList.remove('selected'));

      if (wasSelected && isAlive) {
        // Revert to birth state
        selectedPersonality = null;
        revertToBirth();
        personalityCaption.classList.remove('visible');
        personalityCaption.textContent = '';
        updateButton();
        return;
      }

      // Select this chip
      chip.classList.add('selected');
      selectedPersonality = color;

      // Show caption
      const trait = personalityTraits[color];
      personalityCaption.textContent = trait.keywords;
      personalityCaption.classList.add('visible');

      // 整屋空气 + 光环 + 心境语 跟随代表色
      applyRep(color);
      pMood.textContent = '\u201C' + trait.keywords + '\u3002\u201D';

      // ─── 诞生时刻 ───
      if (!isAlive) {
        isAlive = true;
        // Avatar infuses
        avatar.className = 'avatar avatar--alive';
        avatar.style.background = avatarGradients[color];
        avatar.style.backgroundBlendMode = 'normal, screen';
        avatarGlyph.textContent = inputName.value ? inputName.value.charAt(0) : '?';

        // Chronicle bar: left stays birth, right becomes personality color
        chronicle.style.background = `linear-gradient(to right, var(--birth), var(--rep-500))`;
        nowDot.style.background = repColors[color][500];
        nowDot.classList.add('now-dot--alive');
        avatarSection.classList.add('alive');
      } else {
        // Already alive — just shift color
        avatar.style.background = avatarGradients[color];
        avatar.style.backgroundBlendMode = 'normal, screen';
        chronicle.style.background = `linear-gradient(to right, var(--birth), var(--rep-500))`;
        nowDot.style.background = repColors[color][500];
      }

      updateButton();
    });
  });

  function revertToBirth() {
    isAlive = false;
    resetRep();
    avatar.style.background = '';
    avatar.style.backgroundBlendMode = '';
    avatar.className = 'avatar avatar--birth';
    avatarGlyph.textContent = '?';
    avatarGlyph.style.color = '';
    chronicle.style.background = '';
    nowDot.style.background = '';
    nowDot.classList.remove('now-dot--alive');
    avatar.classList.remove('avatar--alive');
    avatarSection.classList.remove('alive');
    pMood.textContent = '\u201C我还不知道我是谁。\u201D';
  }

  // ─── Input listeners ───
  function updateGlyph() {
    if (isAlive && inputName.value) {
      avatarGlyph.textContent = inputName.value.charAt(0);
    } else if (isAlive) {
      avatarGlyph.textContent = '?';
    }
  }

  inputName.addEventListener('input', () => {
    updateGlyph();
    updateButton();
  });

  inputUser.addEventListener('input', updateButton);
  inputRole.addEventListener('input', updateButton);

  function allFilled() {
    return inputUser.value.trim() && inputName.value.trim() && inputRole.value.trim() && selectedPersonality;
  }

  function updateButton() {
    if (allFilled()) {
      generateBtn.disabled = false;
    } else {
      generateBtn.disabled = true;
    }
  }

  // ─── 输入聚焦整屋升档 ───
  document.querySelectorAll('.field-input').forEach(el => {
    el.addEventListener('focusin', () => app.classList.add('speaking'));
    el.addEventListener('focusout', () => app.classList.remove('speaking'));
  });

  // ─── Generate ───
  generateBtn.addEventListener('click', () => {
    if (!allFilled()) return;

    const userName = inputUser.value.trim();
    const agentName = inputName.value.trim();
    const role = inputRole.value.trim();
    const trait = personalityTraits[selectedPersonality];

    // 空名防护：名字为空时短暂高亮输入框
    if (!agentName) {
      inputName.style.borderColor = 'var(--danger)';
      inputName.style.outline = '2px solid rgba(239,83,80,.2)';
      setTimeout(() => { inputName.style.borderColor = ''; inputName.style.outline = ''; }, 1500);
      return;
    }

    // Button state
    generateBtn.textContent = '身份生成中…';
    generateBtn.classList.add('pulsing');
    generateBtn.disabled = true;

    // Simulate generation delay
    setTimeout(() => {
      generateBtn.classList.remove('pulsing');
      generateBtn.textContent = '已生成';

      const text = generateIdentityText(userName, agentName, role, trait);
      generatedText.textContent = text;
      generatedOutput.classList.add('visible');
    }, 2200);
  });

  function generateIdentityText(user, name, role, trait) {
    const traitAdjectives = {
      openness:           ['好奇的', '富有想象力的', '不拘一格的'],
      conscientiousness:  ['严谨的', '可靠的', '有条理的'],
      extraversion:       ['热情的', '主动的', '善于表达的'],
      agreeableness:      ['温和的', '体贴的', '善解人意的'],
      neuroticism:        ['敏感的', '深刻的', '内敛的']
    };
    const adj = traitAdjectives[selectedPersonality];
    const personalityDesc = adj.join('、');

    return `我是${name}，${user}的${role}。${name}说话简洁克制，偏向安静地观察，偶尔带点细腻的察觉。${name}是${personalityDesc}。${name}不喧哗，只是平静地回应，用简短的句子传递温度。${name}就是这样。`;
  }

})();
</script>
<script src="shared/theme-switch.js"></script>
</body>
</html>
