<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>northing — 自我认知</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Noto+Sans+SC:wght@400;500&family=JetBrains+Mono:wght@400&display=swap');

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  /* 代表色 — 出生灰白态（选色后由 JS 覆盖） */
  --rep-300: #D6D2CB;
  --rep-400: #C9C4BC;
  --rep-500: #B5B0A8;
  --rep-600: #9E9991;

  /* 深渊 — 冷青 */
  --abyss-300: #7AABA4;
  --abyss-400: #5A9B93;
  --abyss-500: #3F837B;

  /* 基底 — 咨询室 */
  --bg: #F4F3F0;
  --surface: #FBFAF8;
  --elevated: #FFFFFF;
  --raised: #EFEDE8;
  --border: #E6E3DD;
  --border-soft: #ECEAE5;
  --fg: #38352E;
  --muted: #7B766C;
  --faint: #A8A398;

  /* 出生灰白 */
  --birth: #DAD6CF;

  /* 圆角 */
  --r-sm: 9px;
  --r-md: 14px;
  --r-lg: 18px;
  --r-pill: 999px;

  /* 动效 */
  --ease: cubic-bezier(0.25, 0.1, 0.25, 1);
  --transition-state: 350ms ease-out;
  --transition-growth: 1200ms var(--ease);
  --grow: 1200ms cubic-bezier(0.25, 0.1, 0.25, 1);

  --page-out: #1a1917;
}

/* ─── 暗色皮肤 — 同骨架换皮肤 ─── */
[data-theme="dark"] {
  --bg: #181612;
  --surface: #211E19;
  --elevated: #2A2620;
  --raised: #322D26;
  --border: #3A342C;
  --border-soft: #2E2922;
  --fg: #EDE8DF;
  --muted: #A89F92;
  --faint: #786F63;
  --birth: #4A443B;
  --page-out: #0c0b09;
}
[data-theme="dark"] body::before { background: radial-gradient(ellipse 160% 120% at 50% 4%, color-mix(in srgb, var(--rep-500) 5%, transparent) 0%, transparent 100%); }
[data-theme="dark"] .presence::before { background: radial-gradient(ellipse 50% 50% at 50% 28%, color-mix(in srgb, var(--rep-500) 18%, transparent) 0%, color-mix(in srgb, var(--rep-500) 6%, transparent) 36%, transparent 70%); }

body {
  font-family: 'Noto Sans SC', system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.6;
  color: var(--fg);
  background: var(--page-out);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 24px;
  -webkit-font-smoothing: antialiased;
  transition: background var(--grow);
}

@keyframes breathe {
  0%, 100% { opacity: 0.65; transform: scale(0.985); }
  50% { opacity: 1; transform: scale(1.015); }
}
@keyframes auraBreath {
  0%, 100% { opacity: 0.35; transform: scale(0.96); }
  50% { opacity: 0.7; transform: scale(1.04); }
}
@keyframes moodIn { to { opacity: 0.55; } }
@keyframes moodPulse {
  0%, 100% { opacity: 0.4; }
  50% { opacity: 0.65; }
}

/* ─── 窗口容器 · 整屋空气染色 ─── */
#app {
  position: relative;
  z-index: 1;
  width: 1280px;
  height: 800px;
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow: hidden;
  border-radius: 20px;
  background: color-mix(in srgb, var(--rep-500) 3.5%, var(--bg));
  box-shadow: 0 30px 80px -28px rgba(0, 0, 0, .5);
  transition: background var(--grow);
}
/* 顶晕 — 大椭圆，衰减到 100% 才透明，整窗浸色 */
#app::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse 160% 120% at 50% 4%, color-mix(in srgb, var(--rep-500) 7%, transparent) 0%, transparent 100%);
  pointer-events: none;
  z-index: 0;
  transition: background var(--grow);
}
/* 底部冷雾 */
#app::after {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse 80% 30% at 50% 100%, color-mix(in srgb, var(--abyss-500) 1.5%, transparent) 0%, transparent 60%);
  pointer-events: none;
  z-index: 0;
}
/* 输入聚焦整屋升档 */
#app.speaking { background: color-mix(in srgb, var(--rep-500) 4.5%, var(--bg)); }
#app.speaking::before { background: radial-gradient(ellipse 160% 120% at 50% 4%, color-mix(in srgb, var(--rep-500) 10%, transparent) 0%, transparent 100%); }

/* 内容层 z-index — 只点名，不用 #app>* 通配 */
.container {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 560px;
  margin: auto;
  padding: 24px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 36px;
}

/* ─── 窗口控制 ─── */
.win-ctrl { position: absolute; top: 16px; right: 44px; display: flex; align-items: center; gap: 2px; z-index: 30; }
.win-btn { width: 28px; height: 28px; border-radius: 7px; display: flex; align-items: center; justify-content: center; color: var(--faint); cursor: pointer; transition: .15s; border: none; background: transparent; }
.win-btn:hover { background: var(--raised); color: var(--fg); }
.win-btn.close:hover { background: rgba(220, 53, 69, .1); color: #dc3545; }

/* ─── 品牌水印 — 左下角 ─── */
.watermark { position: absolute; bottom: 22px; left: 44px; display: flex; align-items: center; gap: 6px; opacity: .25; z-index: 2; }
.watermark .bt { font-family: 'Fraunces', serif; font-variation-settings: "WONK" 1, "SOFT" 60; font-size: 11px; color: var(--muted); letter-spacing: .04em; }

/* ─── 在场区 · 出生态头像 ─── */
.presence {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  margin-top: 8px;
  position: relative;
}
/* 体温光晕 */
.presence::before {
  content: '';
  position: absolute;
  top: -30px;
  left: 50%;
  transform: translateX(-50%);
  width: 560px;
  height: 360px;
  background: radial-gradient(ellipse 50% 50% at 50% 28%, color-mix(in srgb, var(--rep-500) 30%, transparent) 0%, color-mix(in srgb, var(--rep-500) 10%, transparent) 36%, transparent 70%);
  pointer-events: none;
  z-index: -1;
  transition: background var(--grow);
}

.avatar-wrap { position: relative; width: 64px; height: 64px; }
/* 光环 — 出生态灰白，选色后跟 rep */
.avatar-wrap::after {
  content: '';
  position: absolute;
  inset: -8px;
  border-radius: 24px;
  background: radial-gradient(circle, rgba(181, 176, 168, .15), transparent 70%);
  animation: auraBreath 6s ease-in-out infinite;
  transition: background var(--grow);
}
.avatar--alive .avatar-wrap::after,
.avatar-wrap.alive::after {
  background: radial-gradient(circle, color-mix(in srgb, var(--rep-400) 20%, transparent), transparent 70%);
}

.avatar {
  width: 64px;
  height: 64px;
  border-radius: var(--r-lg);
  position: relative;
  overflow: hidden;
  transition: background var(--transition-growth), box-shadow var(--transition-growth);
}

.avatar--birth {
  background: radial-gradient(circle at 50% 50%, #DDD9D2, #C9C4BC 60%, #B5B0A8);
}

.avatar--alive {
  animation: breathe 6s var(--ease) infinite;
  box-shadow: 0 4px 16px color-mix(in srgb, var(--rep-500) 28%, transparent), inset 0 1px 3px rgba(255, 255, 255, .25);
}

.avatar-glyph {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Fraunces', Georgia, serif;
  font-variation-settings: "WONK" 1, "SOFT" 60;
  font-size: 32px;
  font-weight: 300;
  color: rgba(80, 75, 68, .5);
  transition: color var(--transition-growth), opacity var(--transition-growth);
  user-select: none;
}

.avatar--alive .avatar-glyph {
  color: rgba(255, 250, 245, .85);
  font-weight: 500;
}

/* 心境语 */
.p-mood {
  font-size: 11.5px;
  color: var(--faint);
  font-style: italic;
  opacity: 0;
  animation: moodIn 3s ease 1.5s forwards, moodPulse 8s ease-in-out 4.5s infinite;
  max-width: 320px;
  text-align: center;
  line-height: 1.6;
}

/* ─── 编年史渐变条 ─── */
.chronicle {
  width: 200px;
  height: 4px;
  border-radius: var(--r-pill);
  position: relative;
  background: linear-gradient(to right, var(--birth), var(--birth));
  transition: background var(--transition-growth);
  overflow: visible;
}

.now-dot {
  position: absolute;
  right: -4px;
  top: 50%;
  transform: translateY(-50%);
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--birth);
  border: 2px solid var(--surface);
  transition: background var(--transition-growth), box-shadow var(--transition-growth);
}

.now-dot--alive {
  box-shadow: 0 0 6px 1px var(--glow, color-mix(in srgb, var(--rep-500) 12%, transparent));
}

/* ─── 配置字段 ─── */
.fields {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 24px;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.field-label {
  font-size: 11.5px;
  font-weight: 500;
  color: var(--muted);
  letter-spacing: 0.02em;
}

.field-input {
  width: 100%;
  height: 44px;
  padding: 0 16px;
  font-family: 'Noto Sans SC', system-ui, sans-serif;
  font-size: 15px;
  color: var(--fg);
  background: var(--elevated);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  outline: none;
  transition: border-color var(--transition-state), box-shadow var(--transition-state), background var(--grow);
}

.field-input::placeholder {
  color: var(--faint);
}

.field-input:focus {
  border-color: var(--rep-500);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--rep-500) 8%, transparent);
}

/* ─── 性格色板 ─── */
.personality {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.personality-row {
  display: flex;
  gap: 16px;
  justify-content: center;
}

.personality-chip {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: 2.5px solid transparent;
  cursor: pointer;
  position: relative;
  transition: transform var(--transition-state), border-color var(--transition-state), box-shadow var(--transition-state);
  background: none;
  padding: 0;
}

.personality-chip:hover {
  transform: scale(1.1);
}

.personality-chip::before {
  content: '';
  display: block;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  transition: background var(--transition-state);
}

.personality-chip[data-color="openness"]::before { background: #9B7FBF; }
.personality-chip[data-color="conscientiousness"]::before { background: #4A6FA5; }
.personality-chip[data-color="extraversion"]::before { background: var(--rep-500); }
.personality-chip[data-color="agreeableness"]::before { background: #6B9E7A; }
.personality-chip[data-color="neuroticism"]::before { background: var(--abyss-500); }

.personality-chip.selected {
  border-color: var(--rep-500);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--rep-500) 15%, transparent);
}

.personality-chip[data-color="openness"].selected { border-color: #9B7FBF; box-shadow: 0 0 0 3px rgba(155, 127, 191, .15); }
.personality-chip[data-color="conscientiousness"].selected { border-color: #4A6FA5; box-shadow: 0 0 0 3px rgba(74, 111, 165, .15); }
.personality-chip[data-color="extraversion"].selected { border-color: var(--rep-500); box-shadow: 0 0 0 3px color-mix(in srgb, var(--rep-500) 15%, transparent); }
.personality-chip[data-color="agreeableness"].selected { border-color: #6B9E7A; box-shadow: 0 0 0 3px rgba(107, 158, 122, .15); }
.personality-chip[data-color="neuroticism"].selected { border-color: var(--abyss-500); box-shadow: 0 0 0 3px rgba(63, 131, 123, .15); }

/* tooltip */
.personality-chip .tip {
  position: absolute;
  bottom: calc(100% + 10px);
  left: 50%;
  transform: translateX(-50%) translateY(4px);
  white-space: nowrap;
  font-size: 12px;
  font-family: 'JetBrains Mono', monospace;
  color: var(--fg);
  background: var(--elevated);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 4px 10px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 200ms ease, transform 200ms ease, background var(--grow);
}

.personality-chip .tip::after {
  content: '';
  position: absolute;
  top: 100%;
  left: 50%;
  transform: translateX(-50%);
  border: 5px solid transparent;
  border-top-color: var(--border);
}

.personality-chip:hover .tip {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

.personality-caption {
  text-align: center;
  font-size: 13px;
  color: var(--muted);
  font-family: 'JetBrains Mono', monospace;
  min-height: 20px;
  transition: opacity var(--transition-state);
  opacity: 0;
}

.personality-caption.visible {
  opacity: 1;
}

/* ─── 生成按钮 ─── */
.action-area {
  width: 100%;
  display: flex;
  justify-content: center;
  padding-top: 8px;
  opacity: 0;
  transform: translateY(8px);
  transition: opacity var(--transition-state), transform var(--transition-state);
  pointer-events: none;
}

.action-area.visible {
  opacity: 1;
  transform: translateY(0);
  pointer-events: auto;
}

.generate-btn {
  width: 220px;
  height: 36px;
  border: none;
  border-radius: 11px;
  background: var(--rep-500);
  color: #FFFAF5;
  font-family: 'Noto Sans SC', system-ui, sans-serif;
  font-size: 15px;
  font-weight: 500;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: background var(--transition-state), box-shadow var(--transition-state), transform 150ms ease, opacity var(--transition-state);
  box-shadow: 0 0 20px color-mix(in srgb, var(--rep-500) 20%, transparent);
}

.generate-btn:hover {
  background: var(--rep-600);
  box-shadow: 0 0 28px color-mix(in srgb, var(--rep-500) 30%, transparent);
  transform: translateY(-1px);
}

.generate-btn:active {
  transform: translateY(0);
}

.generate-btn:disabled {
  opacity: 0.35;
  cursor: default;
  pointer-events: none;
  box-shadow: none;
  transform: none;
}

/* 光脉冲 */
.generate-btn.pulsing::after {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .25), transparent);
  animation: pulse-sweep 1.8s var(--ease) infinite;
}

@keyframes pulse-sweep {
  0% { left: -100%; }
  100% { left: 200%; }
}

/* ─── 生成示例文本 ─── */
.generated-output {
  width: 100%;
  opacity: 0;
  transform: translateY(12px);
  transition: opacity 800ms ease, transform 800ms ease;
}

.generated-output.visible {
  opacity: 1;
  transform: translateY(0);
}

.generated-text {
  font-family: 'Fraunces', Georgia, serif;
  font-variation-settings: "WONK" 1, "SOFT" 60;
  font-size: 16px;
  line-height: 1.8;
  color: var(--fg);
  text-align: center;
  padding: 24px 20px;
  background: var(--surface);
  border: 1px solid var(--border-soft);
  border-radius: var(--r-md);
  position: relative;
  transition: background var(--grow), border-color var(--grow);
}

.generated-text::before {
  content: '「';
  position: absolute;
  top: 12px; left: 14px;
  font-size: 20px;
  color: var(--faint);
  font-family: 'Fraunces', serif;
}

.generated-text::after {
  content: '」';
  position: absolute;
  bottom: 12px; right: 14px;
  font-size: 20px;
  color: var(--faint);
  font-family: 'Fraunces', serif;
}

/* ─── 渗透补强 ─── */
::selection { background: color-mix(in srgb, var(--rep-300) 40%, transparent); color: var(--fg); }
:focus-visible { outline: 2px solid color-mix(in srgb, var(--rep-500) 55%, transparent); outline-offset: 2px; }

/* ─── 演示用亮/暗切换钮 ─── */
.theme-toggle { position: fixed; right: 16px; bottom: 16px; z-index: 60; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--border); background: var(--elevated); color: var(--muted); cursor: pointer; font-size: 15px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(0, 0, 0, .12); transition: .2s; }
.theme-toggle:hover { color: var(--fg); }

/* ─── Reduced motion ─── */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    transition-duration: 0.01ms !important;
    animation-duration: 0.01ms !important;
  }
}
</style>
</head>
<body>

<div id="app">

  <div class="win-ctrl">
    <button class="win-btn" title="最小化"><svg width="12" height="12" viewBox="0 0 12 12"><line x1="2" y1="6" x2="10" y2="6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
    <button class="win-btn" title="最大化"><svg width="12" height="12" viewBox="0 0 12 12"><rect x="2" y="2" width="8" height="8" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.3"/></svg></button>
    <button class="win-btn close" title="关闭"><svg width="12" height="12" viewBox="0 0 12 12"><line x1="3" y1="3" x2="9" y2="9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="9" y1="3" x2="3" y2="9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
  </div>

  <div class="watermark">
    <svg width="14" height="14" viewBox="0 0 240 240"><g fill="none" stroke="#7B766C" stroke-linecap="round"><circle cx="120" cy="120" r="16" stroke-width="6"/><path d="M120 60 A60 60 0 1 1 78 78" stroke-width="8"/><path d="M120 30 A90 90 0 1 1 50 60" stroke-width="10"/></g><line x1="30" y1="120" x2="210" y2="120" stroke="#7B766C" stroke-width="9" stroke-linecap="round"/></svg>
    <span class="bt">northing</span>
  </div>

  <div class="container">
    <!-- 出生态头像 · 在场区 -->
    <div class="presence avatar-section" id="avatarSection">
      <div class="avatar-wrap">
        <div class="avatar avatar--birth" id="avatar">
          <span class="avatar-glyph" id="avatarGlyph">?</span>
        </div>
      </div>
      <div class="p-mood" id="pMood">"我还不知道我是谁。"</div>
      <div class="chronicle" id="chronicle">
        <div class="now-dot" id="nowDot"></div>
      </div>
    </div>

    <!-- 配置字段 -->
    <div class="fields">
      <div class="field">
        <label class="field-label">用户是</label>
        <input class="field-input" type="text" id="inputUser" placeholder="UmR" autocomplete="off">
      </div>
      <div class="field">
        <label class="field-label">你是</label>
        <input class="field-input" type="text" id="inputName" placeholder="给 agent 的名字" autocomplete="off">
      </div>
      <div class="field">
        <label class="field-label">你是用户的</label>
        <input class="field-input" type="text" id="inputRole" placeholder="同事 / 伙伴 / 镜子……" autocomplete="off">
      </div>

      <!-- 性格色板 -->
      <div class="personality">
        <div class="field-label" style="text-align:center;">你的性格更偏向</div>
        <div class="personality-row">
          <button class="personality-chip" data-color="openness" data-keywords="好奇 · 想象 · 不拘一格" data-hue="270" data-sat="45" data-light="60">
            <span class="tip">开放性</span>
          </button>
          <button class="personality-chip" data-color="conscientiousness" data-keywords="严谨 · 可靠 · 有条理" data-hue="218" data-sat="40" data-light="48">
            <span class="tip">尽责性</span>
          </button>
          <button class="personality-chip" data-color="extraversion" data-keywords="热情 · 主动 · 善于表达" data-hue="20" data-sat="55" data-light="55">
            <span class="tip">外向性</span>
          </button>
          <button class="personality-chip" data-color="agreeableness" data-keywords="温和 · 体贴 · 善解人意" data-hue="138" data-sat="28" data-light="52">
            <span class="tip">宜人性</span>
          </button>
          <button class="personality-chip" data-color="neuroticism" data-keywords="敏感 · 深刻 · 内敛" data-hue="168" data-sat="35" data-light="46">
            <span class="tip">神经质</span>
          </button>
        </div>
        <div class="personality-caption" id="personalityCaption"></div>
      </div>
    </div>

    <!-- 生成按钮 -->
    <div class="action-area" id="actionArea">
      <button class="generate-btn" id="generateBtn" disabled>生成身份</button>
    </div>

    <!-- 生成示例 -->
    <div class="generated-output" id="generatedOutput">
      <div class="generated-text" id="generatedText"></div>
    </div>
  </div>

</div>

<button class="theme-toggle" id="themeToggle" title="切换亮/暗（演示）">◐</button>

<script>
(function() {
  const root = document.documentElement;
  const app = document.getElementById('app');
  const avatarSection = document.getElementById('avatarSection');
  const avatar = document.getElementById('avatar');
  const avatarGlyph = document.getElementById('avatarGlyph');
  const chronicle = document.getElementById('chronicle');
  const nowDot = document.getElementById('nowDot');
  const pMood = document.getElementById('pMood');
  const inputUser = document.getElementById('inputUser');
  const inputName = document.getElementById('inputName');
  const inputRole = document.getElementById('inputRole');
  const personalityCaption = document.getElementById('personalityCaption');
  const actionArea = document.getElementById('actionArea');
  const generateBtn = document.getElementById('generateBtn');
  const generatedOutput = document.getElementById('generatedOutput');
  const generatedText = document.getElementById('generatedText');
  const chips = document.querySelectorAll('.personality-chip');

  let selectedPersonality = null;
  let isAlive = false;

  function hexToRgba(hex, alpha) {
    const r = parseInt(hex.slice(1,3), 16);
    const g = parseInt(hex.slice(3,5), 16);
    const b = parseInt(hex.slice(5,7), 16);
    return `rgba(${r},${g},${b},${alpha})`;
  }

  // 代表色组 — 选色后覆盖 --rep-*，整屋空气随之换色
  const repColors = {
    openness:          { 300: '#C4A8D8', 400: '#AF94CB', 500: '#9B7FBF', 600: '#7E63A3' },
    conscientiousness: { 300: '#7A9CC4', 400: '#6288B5', 500: '#4A6FA5', 600: '#3A5A88' },
    extraversion:      { 300: '#E5A583', 400: '#D68A63', 500: '#C8714C', 600: '#A85A38' },
    agreeableness:     { 300: '#8FBFA0', 400: '#7DB08D', 500: '#6B9E7A', 600: '#55825F' },
    neuroticism:       { 300: '#7AABA4', 400: '#5A9B93', 500: '#3F837B', 600: '#2F6A63' }
  };

  // Personality avatar gradients
  const avatarGradients = {
    openness:           'radial-gradient(circle at 32% 28%, #C4A8D8 0%, #9B7FBF 42%, #6B4F8A 100%), radial-gradient(circle at 68% 72%, rgba(155,127,191,.35))',
    conscientiousness:  'radial-gradient(circle at 32% 28%, #7A9CC4 0%, #4A6FA5 42%, #2D4A73 100%), radial-gradient(circle at 68% 72%, rgba(74,111,165,.35))',
    extraversion:       'radial-gradient(circle at 32% 28%, #E5A583 0%, #C8714C 42%, #8A5540 100%), radial-gradient(circle at 68% 72%, rgba(63,131,123,.45))',
    agreeableness:      'radial-gradient(circle at 32% 28%, #8FBFA0 0%, #6B9E7A 42%, #4A7358 100%), radial-gradient(circle at 68% 72%, rgba(107,158,122,.35))',
    neuroticism:        'radial-gradient(circle at 32% 28%, #7AABA4 0%, #3F837B 42%, #2A5C55 100%), radial-gradient(circle at 68% 72%, rgba(63,131,123,.45))'
  };

  const personalityTraits = {
    openness:           { label: '开放性', keywords: '好奇 · 想象 · 不拘一格' },
    conscientiousness:  { label: '尽责性', keywords: '严谨 · 可靠 · 有条理' },
    extraversion:       { label: '外向性', keywords: '热情 · 主动 · 善于表达' },
    agreeableness:      { label: '宜人性', keywords: '温和 · 体贴 · 善解人意' },
    neuroticism:        { label: '神经质', keywords: '敏感 · 深刻 · 内敛' }
  };

  function applyRep(color) {
    const c = repColors[color];
    root.style.setProperty('--rep-300', c[300]);
    root.style.setProperty('--rep-400', c[400]);
    root.style.setProperty('--rep-500', c[500]);
    root.style.setProperty('--rep-600', c[600]);
  }

  function resetRep() {
    root.style.setProperty('--rep-300', '#D6D2CB');
    root.style.setProperty('--rep-400', '#C9C4BC');
    root.style.setProperty('--rep-500', '#B5B0A8');
    root.style.setProperty('--rep-600', '#9E9991');
  }

  // ─── Personality selection ───
  chips.forEach(chip => {
    chip.addEventListener('click', () => {
      const color = chip.dataset.color;
      const wasSelected = chip.classList.contains('selected');

      // Deselect all
      chips.forEach(c => c.classList.remove('selected'));

      if (wasSelected && isAlive) {
        // Revert to birth state
        selectedPersonality = null;
        revertToBirth();
        personalityCaption.classList.remove('visible');
        personalityCaption.textContent = '';
        updateButton();
        return;
      }

      // Select this chip
      chip.classList.add('selected');
      selectedPersonality = color;

      // Show caption
      const trait = personalityTraits[color];
      personalityCaption.textContent = trait.keywords;
      personalityCaption.classList.add('visible');

      // 整屋空气 + 光环 + 心境语 跟随代表色
      applyRep(color);
      pMood.textContent = '\u201C' + trait.keywords + '\u3002\u201D';

      // ─── 诞生时刻 ───
      if (!isAlive) {
        isAlive = true;
        // Avatar infuses
        avatar.className = 'avatar avatar--alive';
        avatar.style.background = avatarGradients[color];
        avatar.style.backgroundBlendMode = 'normal, screen';
        avatarGlyph.textContent = inputName.value ? inputName.value.charAt(0) : '?';

        // Chronicle bar: left stays birth, right becomes personality color
        chronicle.style.background = `linear-gradient(to right, var(--birth), var(--rep-500))`;
        chronicle.style.setProperty('--glow', hexToRgba(repColors[color][500], .2));
        nowDot.style.background = repColors[color][500];
        nowDot.classList.add('now-dot--alive');
        avatarSection.classList.add('alive');
      } else {
        // Already alive — just shift color
        avatar.style.background = avatarGradients[color];
        avatar.style.backgroundBlendMode = 'normal, screen';
        chronicle.style.background = `linear-gradient(to right, var(--birth), var(--rep-500))`;
        chronicle.style.setProperty('--glow', hexToRgba(repColors[color][500], .2));
        nowDot.style.background = repColors[color][500];
      }

      updateButton();
    });
  });

  function revertToBirth() {
    isAlive = false;
    resetRep();
    avatar.style.background = '';
    avatar.style.backgroundBlendMode = '';
    avatar.className = 'avatar avatar--birth';
    avatarGlyph.textContent = '?';
    avatarGlyph.style.color = '';
    chronicle.style.background = '';
    chronicle.style.removeProperty('--glow');
    nowDot.style.background = '';
    nowDot.classList.remove('now-dot--alive');
    avatar.classList.remove('avatar--alive');
    avatarSection.classList.remove('alive');
    pMood.textContent = '\u201C我还不知道我是谁。\u201D';
  }

  // ─── Input listeners ───
  function updateGlyph() {
    if (isAlive && inputName.value) {
      avatarGlyph.textContent = inputName.value.charAt(0);
    } else if (isAlive) {
      avatarGlyph.textContent = '?';
    }
  }

  inputName.addEventListener('input', () => {
    updateGlyph();
    updateButton();
  });

  inputUser.addEventListener('input', updateButton);
  inputRole.addEventListener('input', updateButton);

  function allFilled() {
    return inputUser.value.trim() && inputName.value.trim() && inputRole.value.trim() && selectedPersonality;
  }

  function updateButton() {
    if (allFilled()) {
      generateBtn.disabled = false;
      actionArea.classList.add('visible');
    } else {
      generateBtn.disabled = true;
      actionArea.classList.remove('visible');
    }
  }

  // ─── 输入聚焦整屋升档 ───
  document.querySelectorAll('.field-input').forEach(el => {
    el.addEventListener('focusin', () => app.classList.add('speaking'));
    el.addEventListener('focusout', () => app.classList.remove('speaking'));
  });

  // ─── Generate ───
  generateBtn.addEventListener('click', () => {
    if (!allFilled()) return;

    const userName = inputUser.value.trim();
    const agentName = inputName.value.trim();
    const role = inputRole.value.trim();
    const trait = personalityTraits[selectedPersonality];

    // Button state
    generateBtn.textContent = '身份生成中…';
    generateBtn.classList.add('pulsing');
    generateBtn.disabled = true;

    // Simulate generation delay
    setTimeout(() => {
      generateBtn.classList.remove('pulsing');
      generateBtn.textContent = '已生成';

      const text = generateIdentityText(userName, agentName, role, trait);
      generatedText.textContent = text;
      generatedOutput.classList.add('visible');
    }, 2200);
  });

  function generateIdentityText(user, name, role, trait) {
    const traitAdjectives = {
      openness:           ['好奇的', '富有想象力的', '不拘一格的'],
      conscientiousness:  ['严谨的', '可靠的', '有条理的'],
      extraversion:       ['热情的', '主动的', '善于表达的'],
      agreeableness:      ['温和的', '体贴的', '善解人意的'],
      neuroticism:        ['敏感的', '深刻的', '内敛的']
    };
    const adj = traitAdjectives[selectedPersonality];
    const personalityDesc = adj.join('、');

    return `我是${name}，${user}的${role}。${name}说话简洁克制，偏向安静地观察，偶尔带点细腻的察觉。${name}是${personalityDesc}。${name}不喧哗，只是平静地回应，用简短的句子传递温度。${name}就是这样。`;
  }

  // ─── 演示用亮/暗切换（默认跟随系统） ───
  (function(){
    const t=document.getElementById('themeToggle');if(!t)return;
    const set=m=>{m==='dark'?document.documentElement.setAttribute('data-theme','dark'):document.documentElement.removeAttribute('data-theme');t.textContent=m==='dark'?'◑':'◐';};
    let cur=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';set(cur);
    t.addEventListener('click',()=>{cur=cur==='dark'?'light':'dark';set(cur);});
  })();
})();
</script>
</body>
</html>
