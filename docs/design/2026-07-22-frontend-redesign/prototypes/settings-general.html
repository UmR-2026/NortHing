<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>设置 — 通用 · northing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,WONK,SOFT@9..144,100..900,0..1,0..100&family=Noto+Sans+SC:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/tokens.css">
<link rel="stylesheet" href="shared/components.css">
<link rel="stylesheet" href="shared/animations.css">
<link rel="stylesheet" href="shared/layout.css">
<style>
  /* ======================================================================
   * settings-general.html — 通用设置
   * ----------------------------------------------------------------------
   * 画布：1280×800（.shell 纵向：顶栏 + 内容行）
   * 布局：顶栏(52px) + content(nav 240px | content-body flex:1)
   * 设计语言：与 chat-collapsed.html 同源——咨询室基底 + rep-500 强调
   *
   * Slint 映射：
   *   .shell         → Window root (column: topbar | content)
   *   .topbar        → HBox (title | spacer | theme-toggle) height:52
   *   .content       → HBox (nav | content-body) flex:1
   *   .nav           → VBox (width:240; surface; border-right-soft)
   *   .content-body  → ScrollView (flex:1; padding; gap:s5)
   *   .toggle        → Rectangle(40×22; pill; animate background 350ms)
   *   .segment-group → HBox (bg; r-sm; padding:3; gap:2)
   * ====================================================================== */

  /* ─── Topbar（52px） ─── */
  /* Slint: HBox { height:52; padding:0 100px 0 24px; border-bottom:1px border-soft } */
  .topbar {
    height: 52px;
    border-bottom: 1px solid var(--border-soft);
    padding-right: 100px;
  }
  .topbar-title {
    font-family: var(--font-display);
    font-size: var(--fs-lg);
    font-weight: 500;
    color: var(--fg);
    font-variation-settings: "WONK" 1, "SOFT" 60;
  }
  .topbar-spacer { flex: 1; }
  .topbar-btn {
    width: 30px; height: 30px;
    border-radius: var(--r-sm);
    border: none; background: transparent;
    color: var(--faint); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px;
    transition: background .15s, color .15s;
  }
  .topbar-btn:hover { background: var(--raised); color: var(--muted); }

  /* ─── Nav（240px） ─── */
  /* Slint: VBox { width:240; surface; border-right-soft; padding:s5 s4; gap:s5 } */
  .nav {
    width: 240px; flex-shrink: 0;
    background: var(--surface);
    border-right: 1px solid var(--border-soft);
    /* 底部留白避让品牌水印（左下角） */
    padding: var(--s5) var(--s4) 60px;
    display: flex; flex-direction: column; gap: var(--s5);
    overflow-y: auto;
    transition: background var(--grow), border-color var(--grow);
  }
  .nav-group { display: flex; flex-direction: column; gap: 2px; }
  .nav-group-label {
    font-size: var(--fs-sm); font-weight: 500; color: var(--faint);
    letter-spacing: 0.1em; text-transform: uppercase;
    padding: 0 var(--s3); margin-bottom: 6px;
  }
  .nav-group + .nav-group { margin-top: var(--s2); }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px var(--s3) 8px 18px; border-radius: var(--r-sm);
    font-size: var(--fs-body); color: var(--muted);
    cursor: pointer; text-decoration: none; user-select: none;
    border: none; background: transparent; width: 100%; text-align: left;
    font-family: inherit; line-height: 1.4; position: relative;
    transition: background var(--toggle-duration) var(--ease), color var(--toggle-duration) var(--ease);
  }
  .nav-item:hover { background: var(--raised); color: var(--fg); }
  /* 活跃项：rep 暖雾底 + 呼吸点（同 chat-collapsed 状态点），非冷灰 raised */
  .nav-item.active {
    background: var(--halo-rep-settings); color: var(--fg); font-weight: 500;
    box-shadow: none;
  }
  .nav-item.active::before {
    content: ''; position: absolute; left: 5px; top: 50%;
    transform: translateY(-50%);
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--rep-500);
    filter: drop-shadow(0 0 3px var(--rep-400));
    animation: breathe 6s ease-in-out infinite;
    transition: background var(--grow);
  }
  .nav-item-icon {
    width: 18px; height: 18px;
    display: flex; align-items: center; justify-content: center;
    opacity: 0.7; flex-shrink: 0;
  }
  .nav-item.active .nav-item-icon { opacity: 1; }

  /* ─── Content body（flex:1 scrollable） ─── */
  /* Slint: ScrollView { flex:1; padding:s6 40px; gap:s5 } */
  /* 暖雾底色 air-rep-settings，非纯白； generous padding 增加咨询室松弛感 */
  .content-body {
    flex: 1; min-width: 0; overflow-y: auto;
    padding: var(--s6) 40px 60px;
    background: var(--air-rep-settings);
    display: flex; flex-direction: column; gap: var(--s5);
    transition: background var(--grow);
  }
  .content-body::-webkit-scrollbar { width: 6px; }
  .content-body::-webkit-scrollbar-track { background: transparent; }
  .content-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: var(--r-pill); }
  .content-body::-webkit-scrollbar-thumb:hover { background: var(--muted); }

  /* ─── Cards ─── */
  /* 卡片：暖底 surface + 暖 drop-shadow（非冷灰阴影），咨询室器物质感 */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    padding: var(--s6);
    filter: drop-shadow(0 2px 8px rgba(80,70,55,.08));
    transition: background var(--grow), border-color var(--grow), filter var(--grow);
  }
  /* 卡片标题：Fraunces 品牌字，像房间里的区域铭牌，不是表单字段标签 */
  .card-title {
    font-family: var(--font-display);
    font-size: 18px; font-weight: 500; color: var(--fg);
    font-variation-settings: "WONK" 1, "SOFT" 60;
    margin-bottom: var(--s5);
  }

  /* ─── Toggle（调节设施的环境，非二进制命令） ─── */
  /* Slint: Rectangle { width:40; height:22; border-radius:pill; animate background 350ms } */
  .toggle {
    position: relative; width: 40px; height: 22px; flex-shrink: 0;
    display: inline-block;
  }
  .toggle input { opacity: 0; width: 0; height: 0; position: absolute; }
  .toggle-track {
    position: absolute; inset: 0;
    background: var(--border); border-radius: var(--r-pill);
    cursor: pointer;
    transition: background var(--toggle-duration) var(--ease);
  }
  .toggle-track::after {
    content: ''; position: absolute; left: 3px; top: 3px;
    width: 16px; height: 16px; background: var(--surface);
    border-radius: var(--r-pill);
    filter: drop-shadow(0 1px 2px rgba(80,70,55,0.10));
    transition: transform var(--toggle-duration) var(--ease);
  }
  .toggle input:checked + .toggle-track { background: var(--rep-500); }
  .toggle input:checked + .toggle-track::after { transform: translateX(18px); }
  .toggle input:focus-visible + .toggle-track {
    outline: 2px solid var(--rep-500); outline-offset: 2px;
  }

  /* ─── Segmented control ─── */
  /* Slint: HBox { background:bg; border-radius:r-sm; padding:3; gap:2 } */
  .segment-group {
    display: flex; background: var(--bg);
    border-radius: var(--r-sm); padding: 3px; gap: 2px;
    width: fit-content;
    transition: background var(--grow);
  }
  .segment {
    padding: 6px 14px; border-radius: 7px;
    font-size: var(--fs-body); color: var(--muted);
    cursor: pointer; border: none; background: transparent;
    font-family: inherit; white-space: nowrap;
    transition: background var(--toggle-duration) var(--ease), color var(--toggle-duration) var(--ease);
  }
  .segment:hover { color: var(--fg); }
  .segment.active {
    background: var(--raised); color: var(--fg); font-weight: 500;
    filter: drop-shadow(0 1px 2px rgba(56,53,46,0.06));
  }
  .segment-swatch {
    width: 14px; height: 14px; border-radius: 4px;
    display: inline-block; vertical-align: middle;
    margin-right: 6px; flex-shrink: 0;
  }
  .swatch-system { background: linear-gradient(135deg, var(--elevated) 50%, var(--fg) 50%); }
  .swatch-light { background: var(--elevated); border: 1px solid var(--border); }
  .swatch-dark { background: var(--fg); }

  /* ─── Inputs ─── */
  .input {
    width: 100%; height: 40px; padding: 0 14px;
    background: var(--elevated); border: 1px solid var(--border);
    border-radius: var(--r-sm);
    font-family: var(--font-body); font-size: var(--fs-body); color: var(--fg);
    outline: none;
    transition: border-color var(--toggle-duration) var(--ease), background var(--grow);
  }
  .input::placeholder { color: var(--faint); }
  .input:focus { border-color: var(--rep-500); }

  /* ─── Select trigger ─── */
  .select { position: relative; width: 100%; max-width: 240px; }
  .select-trigger {
    width: 100%; height: 40px; padding: 0 40px 0 14px;
    background: var(--elevated); border: 1px solid var(--border);
    border-radius: var(--r-sm);
    font-family: var(--font-body); font-size: var(--fs-body); color: var(--fg);
    cursor: pointer; display: flex; align-items: center;
    transition: border-color var(--toggle-duration) var(--ease), background var(--grow);
    appearance: none; -webkit-appearance: none;
  }
  .select-trigger:hover { border-color: var(--muted); }
  .select-trigger:focus { border-color: var(--rep-500); }
  .select-arrow {
    position: absolute; right: 14px; top: 50%;
    transform: translateY(-50%);
    width: 16px; height: 16px; color: var(--muted); pointer-events: none;
  }

  /* ─── Form layout ─── */
  .field { display: flex; flex-direction: column; gap: var(--s2); margin-bottom: var(--s5); }
  .field:last-child { margin-bottom: 0; }
  .field-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: var(--s4); margin-bottom: var(--s5);
  }
  .field-row:last-child { margin-bottom: 0; }
  .field-label { font-size: var(--fs-body); color: var(--fg); font-weight: 400; }
  .field-hint { font-size: var(--fs-lg); color: var(--faint); line-height: 1.4; }
  .field-group { display: flex; flex-direction: column; gap: var(--s5); }
  .divider { height: 1px; background: var(--border-soft); margin: var(--s5) 0; }

  /* ─── Identity section ─── */
  .identity-header { display: flex; align-items: center; gap: 14px; margin-bottom: var(--s4); }
  /* 头像光环 — 照范式 .avatar-wrap::after（auraBreath） */
  .avatar-wrap { position: relative; width: 44px; height: 44px; flex-shrink: 0; }
  .avatar-wrap::after {
    content: ''; position: absolute; inset: -8px;
    border-radius: var(--r-lg);
    background: radial-gradient(circle, var(--rep-400), transparent 70%);
    opacity: 0.2;
    animation: auraBreath 6s ease-in-out infinite;
    transition: background var(--grow);
  }
  .avatar {
    width: 44px; height: 44px; border-radius: var(--r-md);
    position: relative; overflow: hidden;
    background: radial-gradient(circle at 32% 28%, var(--rep-300) 0%, var(--rep-500) 42%, var(--rep-600) 100%);
    display: flex; align-items: center; justify-content: center;
    filter: drop-shadow(0 4px 8px rgba(80,70,55,0.2));
    transition: background var(--grow);
  }
  .avatar::after {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(circle at 68% 72%, rgba(63,131,123,0.4) 0%, transparent 46%);
  }
  .avatar-letter {
    position: relative; z-index: 1;
    font-family: var(--font-display);
    font-size: 20px; font-weight: 500;
    color: rgba(255,250,245,0.88);
    font-variation-settings: "WONK" 1, "SOFT" 60;
  }
  .agent-name {
    font-family: var(--font-display);
    font-size: 20px; font-weight: 500; color: var(--fg);
    font-variation-settings: "WONK" 1, "SOFT" 60;
  }
  /* Chronicle bar — 编年史渐变条 */
  .chronicle {
    width: 100%; height: 6px; border-radius: var(--r-pill);
    background: linear-gradient(90deg, var(--birth) 0%, var(--rep-500) 100%);
    position: relative; margin-bottom: var(--s5);
    transition: background var(--grow);
  }
  .now-dot {
    position: absolute; right: -4px; top: 50%;
    transform: translateY(-50%);
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--rep-500);
    border: 2px solid var(--surface);
    filter: drop-shadow(0 0 0 1px var(--border));
    transition: background var(--grow);
  }
  /* Identity quote — 深渊青左缘 */
  .identity-quote {
    border-left: 2px solid var(--abyss-400);
    background: var(--fog-abyss);
    border-radius: 0 var(--r-sm) var(--r-sm) 0;
    padding: var(--s4) var(--s5);
    font-size: var(--fs-body); line-height: 1.7; color: var(--fg);
    margin-bottom: var(--s5);
  }
  /* Representative color */
  .color-representative { display: flex; align-items: center; gap: 12px; }
  .color-swatch {
    width: 24px; height: 24px; border-radius: 50%;
    background: var(--rep-500);
    filter: drop-shadow(0 0 6px rgba(200,113,76,0.25));
    flex-shrink: 0;
    transition: background var(--grow), filter var(--grow);
  }
  .color-label { font-size: var(--fs-lg); color: var(--faint); }

  /* ─── Danger zone ─── */
  .danger-zone { border-top: 1px solid var(--border-soft); padding-top: var(--s5); margin-top: var(--s5); }
  .danger-btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 16px; border-radius: var(--r-sm);
    font-size: var(--fs-body); font-family: inherit;
    color: var(--muted); background: transparent;
    border: 1px solid var(--border); cursor: pointer;
    transition: color var(--toggle-duration) var(--ease), border-color var(--toggle-duration) var(--ease), background var(--toggle-duration) var(--ease);
  }
  .danger-btn:hover { color: var(--rep-500); border-color: var(--rep-500); }
  .danger-confirm {
    margin-top: 0; background: var(--raised); border-radius: var(--r-sm);
    padding: 0 16px; display: flex; align-items: center; justify-content: space-between;
    gap: 16px; max-height: 0; overflow: hidden; opacity: 0;
    transition: max-height var(--toggle-duration) var(--ease), opacity var(--toggle-duration) var(--ease), margin var(--toggle-duration) var(--ease), padding var(--toggle-duration) var(--ease), background var(--grow);
  }
  .danger-confirm.open { max-height: 80px; opacity: 1; margin-top: 12px; padding: 14px 16px; }
  .danger-confirm-text { font-size: var(--fs-body); color: var(--muted); line-height: 1.4; }
  .danger-confirm-actions { display: flex; gap: var(--s2); flex-shrink: 0; }
  .btn-sm {
    padding: 6px 14px; border-radius: var(--r-sm);
    font-size: var(--fs-body); font-family: inherit; cursor: pointer;
    border: none;
    transition: background var(--toggle-duration) var(--ease), color var(--toggle-duration) var(--ease);
  }
  .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
  .btn-ghost:hover { color: var(--fg); border-color: var(--muted); }
  .btn-rep-ghost {
    background: var(--halo-rep); color: var(--rep-500);
    border: 1px solid var(--rep-300);
  }
  .btn-rep-ghost:hover { background: var(--halo-rep-speaking); }

  /* ─── Dark mode ─── */
  [data-theme="dark"] .nav-item.active {
    background: var(--halo-rep-settings);
    box-shadow: none;
  }
  [data-theme="dark"] .nav-item.active::before {
    background: var(--rep-400);
    filter: drop-shadow(0 0 4px var(--rep-500));
  }
  [data-theme="dark"] .toggle-track::after {
    filter: drop-shadow(0 1px 2px rgba(0,0,0,0.4));
  }
  [data-theme="dark"] .segment.active {
    filter: drop-shadow(0 1px 3px rgba(0,0,0,0.35));
  }
  [data-theme="dark"] .avatar::after {
    background: radial-gradient(circle at 68% 72%, rgba(63,131,123,0.3) 0%, transparent 46%);
  }
  [data-theme="dark"] .color-swatch {
    filter: drop-shadow(0 0 8px rgba(200,113,76,0.3));
  }

</style>
</head>
<body>
<div class="shell">

  <!-- ══════ 顶栏（52px） ══════ -->
  <!-- Slint: HBox { height:52; title | spacer | theme-toggle } -->
  <div class="topbar">
    <div class="topbar-title">设置</div>
    <div class="topbar-spacer"></div>
    <button class="topbar-btn" id="themeToggle" title="切换亮/暗（演示）">◐</button>
  </div>

  <!-- ══════ 窗口控制（右上角） ══════ -->
  <div class="win-ctrl">
    <button class="win-btn" title="最小化"><svg width="12" height="12" viewBox="0 0 12 12"><line x1="2" y1="6" x2="10" y2="6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
    <button class="win-btn" title="最大化"><svg width="12" height="12" viewBox="0 0 12 12"><rect x="2" y="2" width="8" height="8" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.3"/></svg></button>
    <button class="win-btn close" title="关闭"><svg width="12" height="12" viewBox="0 0 12 12"><line x1="3" y1="3" x2="9" y2="9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="9" y1="3" x2="3" y2="9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
  </div>

  <!-- ══════ 品牌水印（左下角） ══════ -->
  <div class="watermark">
    <svg width="14" height="14" viewBox="0 0 240 240"><g fill="none" stroke="#7B766C" stroke-linecap="round"><circle cx="120" cy="120" r="16" stroke-width="6"/><path d="M120 60 A60 60 0 1 1 78 78" stroke-width="8"/><path d="M120 30 A90 90 0 1 1 50 60" stroke-width="10"/></g><line x1="30" y1="120" x2="210" y2="120" stroke="#7B766C" stroke-width="9" stroke-linecap="round"/></svg>
    <span class="bt">northing</span>
  </div>

  <!-- ══════ 内容行（nav | content-body） ══════ -->
  <!-- Slint: HBox { flex:1; nav | content-body } -->
  <div class="content">

    <!-- Left Navigation -->
    <nav class="nav" aria-label="设置导航">
      <div class="nav-group">
        <div class="nav-group-label">偏好</div>
        <button class="nav-item active" data-target="general">
          <span class="nav-item-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg></span>
          通用
        </button>
        <button class="nav-item" data-target="identity">
          <span class="nav-item-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
          自我认知
        </button>
      </div>

      <div class="nav-group">
        <div class="nav-group-label">能力</div>
        <button class="nav-item" data-target="models">
          <span class="nav-item-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><line x1="9" y1="1" x2="9" y2="4"/><line x1="15" y1="1" x2="15" y2="4"/><line x1="9" y1="20" x2="9" y2="23"/><line x1="15" y1="20" x2="15" y2="23"/><line x1="20" y1="9" x2="23" y2="9"/><line x1="20" y1="14" x2="23" y2="14"/><line x1="1" y1="9" x2="4" y2="9"/><line x1="1" y1="14" x2="4" y2="14"/></svg></span>
          模型
        </button>
        <button class="nav-item" data-target="workspace">
          <span class="nav-item-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span>
          工作区
        </button>
        <button class="nav-item" data-target="skills">
          <span class="nav-item-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg></span>
          技能
        </button>
        <button class="nav-item" data-target="mcp">
          <span class="nav-item-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg></span>
          MCP 服务器
        </button>
      </div>

      <div class="nav-group">
        <div class="nav-group-label">安全</div>
        <button class="nav-item" data-target="access">
          <span class="nav-item-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
          访问权限
        </button>
      </div>
    </nav>

    <!-- Right Content -->
    <main class="content-body" data-od-id="settings-content">
      <!-- 通用 Card -->
      <section class="card" data-od-id="card-general">
        <div class="card-title">通用</div>

        <div class="field">
          <label class="field-label" for="codename">临时代号</label>
          <input id="codename" class="input" type="text" value="知序" data-od-id="input-codename">
          <div class="field-hint">它长大后可能给自己取新名字。</div>
        </div>

        <div class="field">
          <label class="field-label">显示模式</label>
          <div class="segment-group" data-od-id="segment-appearance">
            <button class="segment" data-value="system">
              <span class="segment-swatch swatch-system"></span>跟随系统
            </button>
            <button class="segment active" data-value="light">
              <span class="segment-swatch swatch-light"></span>亮
            </button>
            <button class="segment" data-value="dark">
              <span class="segment-swatch swatch-dark"></span>暗
            </button>
          </div>
        </div>

        <div class="field">
          <label class="field-label" for="language">语言</label>
          <div class="select">
            <button class="select-trigger" id="language" data-od-id="select-language">简体中文</button>
            <span class="select-arrow">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
            </span>
          </div>
        </div>

        <div class="field">
          <label class="field-label">启动行为</label>
          <div class="segment-group" data-od-id="segment-launch">
            <button class="segment active" data-value="last-workspace">上次的工作区</button>
            <button class="segment" data-value="welcome">欢迎页</button>
          </div>
        </div>

        <div class="field">
          <label class="field-label">关闭按钮</label>
          <div class="segment-group" data-od-id="segment-close">
            <button class="segment active" data-value="quit">退出</button>
            <button class="segment" data-value="minimize">最小化到托盘</button>
            <button class="segment" data-value="ask">询问</button>
          </div>
        </div>

        <div class="divider"></div>

        <div class="field-group">
          <div class="field-row">
            <div>
              <div class="field-label">自动更新</div>
              <div class="field-hint">有新版本时自动下载并安装</div>
            </div>
            <label class="toggle" data-od-id="toggle-auto-update">
              <input type="checkbox" checked>
              <span class="toggle-track"></span>
            </label>
          </div>

          <div class="field-row">
            <div>
              <div class="field-label">退出时确认</div>
              <div class="field-hint">关闭窗口前询问是否保存</div>
            </div>
            <label class="toggle" data-od-id="toggle-exit-confirm">
              <input type="checkbox" checked>
              <span class="toggle-track"></span>
            </label>
          </div>

          <div class="field-row">
            <div>
              <div class="field-label">遥测</div>
              <div class="field-hint">默认关闭，不收集个人数据</div>
            </div>
            <label class="toggle" data-od-id="toggle-telemetry">
              <input type="checkbox">
              <span class="toggle-track"></span>
            </label>
          </div>
        </div>
      </section>

      <!-- 自我认知 Card -->
      <section class="card" data-od-id="card-identity">
        <div class="card-title">自我认知</div>

        <div class="identity-header">
          <div class="avatar-wrap">
            <div class="avatar" data-od-id="avatar-zhixu">
              <span class="avatar-letter">序</span>
            </div>
          </div>
          <div class="agent-name">知序</div>
        </div>

        <div class="chronicle">
          <div class="now-dot"></div>
        </div>

        <div class="identity-quote" data-od-id="identity-quote">
          我是知序，UmR 的同事。知序说话简洁，偏向安静地观察，在需要时提供清晰、有用的信息。
        </div>

        <div class="color-representative">
          <div class="color-swatch" data-od-id="color-swatch"></div>
          <div class="color-label">代表色由它自己更换，无需确认——identity 是它自己的事。</div>
        </div>

        <div class="danger-zone">
          <button class="danger-btn" id="dangerBtn" data-od-id="btn-reset-identity">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
            清空重来
          </button>
          <div class="danger-confirm" id="dangerConfirm" data-od-id="confirm-reset">
            <div class="danger-confirm-text">清空后它回到出生（灰白），无法撤销。</div>
            <div class="danger-confirm-actions">
              <button class="btn-sm btn-ghost" id="cancelReset">取消</button>
              <button class="btn-sm btn-rep-ghost" id="confirmReset">确认清空</button>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>
</div>

<script>
  // Segment controls
  document.querySelectorAll('.segment-group').forEach(group => {
    group.querySelectorAll('.segment').forEach(btn => {
      btn.addEventListener('click', () => {
        group.querySelectorAll('.segment').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      });
    });
  });

  // Danger zone inline confirmation
  const dangerBtn = document.getElementById('dangerBtn');
  const dangerConfirm = document.getElementById('dangerConfirm');
  const cancelReset = document.getElementById('cancelReset');
  const confirmReset = document.getElementById('confirmReset');

  dangerBtn.addEventListener('click', () => {
    dangerConfirm.classList.toggle('open');
  });

  cancelReset.addEventListener('click', () => {
    dangerConfirm.classList.remove('open');
  });

  confirmReset.addEventListener('click', () => {
    dangerConfirm.classList.remove('open');
    // In a real app, this would trigger the reset
  });

  // Close danger confirm when clicking outside
  document.addEventListener('click', (e) => {
    if (!dangerBtn.contains(e.target) && !dangerConfirm.contains(e.target)) {
      dangerConfirm.classList.remove('open');
    }
  });

  // Select interaction (visual only for this shell)
  const selectTrigger = document.getElementById('language');
  selectTrigger.addEventListener('click', () => {
    selectTrigger.style.borderColor = 'var(--rep-500)';
    setTimeout(() => { selectTrigger.style.borderColor = ''; }, 200);
  });

  // 演示用亮/暗切换（默认跟随系统）
  (function(){
    const t = document.getElementById('themeToggle'); if (!t) return;
    const set = m => {
      m === 'dark' ? document.documentElement.setAttribute('data-theme','dark') : document.documentElement.removeAttribute('data-theme');
      t.textContent = m === 'dark' ? '◑' : '◐';
    };
    let cur = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; set(cur);
    t.addEventListener('click', () => { cur = cur === 'dark' ? 'light' : 'dark'; set(cur); });
  })();
</script>
</body>
</html>
