<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>设置 · 访问权限 · northing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,WONK,SOFT@9..144,100..900,0..1,0..100&family=Noto+Sans+SC:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/tokens.css">
<link rel="stylesheet" href="shared/components.css">
<link rel="stylesheet" href="shared/animations.css">
<link rel="stylesheet" href="shared/layout.css">
<style>
  /* ======================================================================
   * settings-access.html — 访问权限设置
   * ----------------------------------------------------------------------
   * 画布：1280×800（.shell 纵向：顶栏 + 内容行）
   * 布局：顶栏(52px) + content(nav 240px | content-body flex:1)
   * 设计语言：与 chat-collapsed.html 同源——咨询室基底 + rep-500 强调
   *
   * Slint 映射：
   *   .shell         → Window root (column: topbar | content)
   *   .topbar        → HBox (title | spacer | theme-toggle) height:52
   *   .content       → HBox (nav | content-body) flex:1
   *   .nav           → VBox (width:240; surface; border-right-soft)
   *   .content-body  → ScrollView (flex:1; padding; gap:s5)
   *   .segment-group → HBox (bg; r-sm; padding:3; gap:2)
   * ====================================================================== */

  /* ─── Topbar（52px） ─── */
  /* Slint: HBox { height:52; padding:0 100px 0 24px; border-bottom:1px border-soft } */
  .topbar { height: 52px; border-bottom: 1px solid var(--border-soft); padding-right: 100px; }
  .topbar-title { font-family: var(--font-display); font-size: var(--fs-lg); font-weight: 500; color: var(--fg); font-variation-settings: "WONK" 1, "SOFT" 60; }
  .topbar-spacer { flex: 1; }
  .topbar-btn { width: 30px; height: 30px; border-radius: var(--r-sm); border: none; background: transparent; color: var(--faint); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 15px; transition: background .15s, color .15s; }
  .topbar-btn:hover { background: var(--raised); color: var(--muted); }

  /* ─── Nav（240px） ─── */
  /* Slint: VBox { width:240; surface; border-right-soft; padding:s5 s4 60; gap:s5 } */
  .nav { width: 240px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border-soft); padding: var(--s5) var(--s4) 60px; display: flex; flex-direction: column; gap: var(--s5); overflow-y: auto; transition: background var(--grow), border-color var(--grow); }
  .nav-group { display: flex; flex-direction: column; gap: 2px; }
  .nav-group-label { font-size: var(--fs-sm); font-weight: 500; color: var(--faint); letter-spacing: 0.1em; text-transform: uppercase; padding: 0 var(--s3); margin-bottom: 6px; }
  .nav-group + .nav-group { margin-top: var(--s2); }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 8px var(--s3) 8px 18px; border-radius: var(--r-sm); font-size: var(--fs-body); color: var(--muted); cursor: pointer; text-decoration: none; user-select: none; border: none; background: transparent; width: 100%; text-align: left; font-family: inherit; line-height: 1.4; position: relative; transition: background var(--toggle-duration) var(--ease), color var(--toggle-duration) var(--ease); }
  .nav-item:hover { background: var(--raised); color: var(--fg); }
  /* 活跃项：rep 暖雾底 + 呼吸点（同 chat-collapsed 状态点） */
  .nav-item.active { background: var(--halo-rep-settings); color: var(--fg); font-weight: 500; }
  .nav-item.active::before { content: ''; position: absolute; left: 5px; top: 50%; transform: translateY(-50%); width: 5px; height: 5px; border-radius: 50%; background: var(--rep-500); filter: drop-shadow(0 0 3px var(--rep-400)); animation: breathe 6s ease-in-out infinite; transition: background var(--grow); }
  .nav-item-icon { width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; opacity: 0.7; flex-shrink: 0; }
  .nav-item.active .nav-item-icon { opacity: 1; }

  /* ─── Content body（flex:1 scrollable） ─── */
  /* Slint: ScrollView { flex:1; padding:s6 40px; gap:s5 } */
  /* 暖雾底色 air-rep-settings，非纯白 */
  .content-body { flex: 1; min-width: 0; overflow-y: auto; padding: var(--s6) 40px 60px; background: var(--air-rep-settings); display: flex; flex-direction: column; gap: var(--s5); transition: background var(--grow); }
  .content-body::-webkit-scrollbar { width: 6px; }
  .content-body::-webkit-scrollbar-track { background: transparent; }
  .content-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: var(--r-pill); }
  .content-body::-webkit-scrollbar-thumb:hover { background: var(--muted); }
  .content-inner { width: 100%; max-width: 720px; display: flex; flex-direction: column; gap: var(--s5); }

  /* ─── Cards ─── */
  /* 暖底 surface + 暖 drop-shadow（非冷灰阴影） */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md); padding: var(--s6); filter: drop-shadow(0 2px 8px rgba(80,70,55,.08)); transition: background var(--grow), border-color var(--grow), filter var(--grow); }
  /* 卡片标题：Fraunces 品牌字，区域铭牌而非字段标签 */
  .card-title { font-family: var(--font-display); font-size: 18px; font-weight: 500; margin: 0 0 var(--s4); color: var(--fg); font-variation-settings: "WONK" 1, "SOFT" 60; }
  .card-hint { font-size: var(--fs-lg); color: var(--faint); margin: 0 0 var(--s4); line-height: 1.5; }

  /* ─── Segmented control ─── */
  /* Slint: HBox { background:bg; border-radius:r-sm; padding:3; gap:2 } */
  .segment-group { display: flex; background: var(--bg); border-radius: var(--r-sm); padding: 3px; gap: 2px; width: fit-content; transition: background var(--grow); }
  .segment { padding: 6px 14px; border-radius: 7px; font-size: var(--fs-body); color: var(--muted); cursor: pointer; border: none; background: transparent; font-family: inherit; white-space: nowrap; transition: background var(--toggle-duration) var(--ease), color var(--toggle-duration) var(--ease); }
  .segment:hover { color: var(--fg); }
  .segment.active { background: var(--raised); color: var(--fg); font-weight: 500; filter: drop-shadow(0 1px 2px rgba(56,53,46,0.06)); }
  /* Large variant for autonomy control */
  .segment-lg { padding: 10px 22px; font-size: var(--fs-body); }
  /* Small variant for per-mode rows */
  .segment-sm { padding: 5px 12px; font-size: 13px; }
  .seg-desc { font-size: var(--fs-lg); color: var(--faint); margin-top: 10px; line-height: 1.5; min-height: 20px; transition: opacity 200ms var(--ease); }

  /* ─── Per-mode overrides ─── */
  .mode-list { display: flex; flex-direction: column; }
  .mode-group-label { font-size: var(--fs-sm); font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; padding: 12px 0 6px; color: var(--faint); }
  .mode-group-label.rep-accent { color: var(--rep-500); }
  .mode-group-label.abyss-accent { color: var(--abyss-500); }
  .mode-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border-soft); }
  .mode-row:last-child { border-bottom: none; }
  .mode-name { font-family: var(--font-mono); font-size: var(--fs-lg); color: var(--fg); letter-spacing: -0.01em; min-width: 110px; }
  .mode-microcopy { font-size: 14px; color: var(--faint); margin-left: auto; padding-right: 8px; }

  /* ─── Denylist ─── */
  /* 深渊青底色 — cold/security feel */
  .deny-card { background: var(--archive-cold-bg); border: 1px solid var(--abyss-300); border-radius: var(--r-sm); padding: 14px 16px; font-family: var(--font-mono); font-size: 13px; color: var(--abyss-500); line-height: 1.55; display: flex; flex-direction: column; gap: 6px; }
  .deny-row { display: flex; gap: 10px; align-items: baseline; }
  .deny-prefix { color: var(--muted); user-select: none; }
  .deny-expand { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: var(--r-sm); border: none; background: transparent; color: var(--abyss-500); font-family: inherit; font-size: var(--fs-lg); font-weight: 500; cursor: pointer; transition: background var(--toggle-duration) var(--ease), color var(--toggle-duration) var(--ease); margin-top: 10px; }
  .deny-expand:hover { background: var(--halo-abyss); color: var(--abyss-400); }
  .deny-expand[aria-expanded="true"] .chevron { transform: rotate(180deg); }
  .chevron { display: inline-block; transition: transform var(--toggle-duration) var(--ease); font-size: 10px; opacity: 0.7; }
  .deny-add { display: flex; gap: var(--s2); align-items: center; overflow: hidden; max-height: 0; opacity: 0; transition: max-height var(--toggle-duration) var(--ease), opacity 250ms var(--ease), margin var(--toggle-duration) var(--ease); margin-top: 0; }
  .deny-add.is-open { max-height: 60px; opacity: 1; margin-top: 10px; }
  .deny-input { flex: 1; min-width: 0; padding: 8px 12px; border-radius: var(--r-sm); border: 1px solid var(--border); background: var(--elevated); color: var(--fg); font-family: var(--font-mono); font-size: 13px; outline: none; transition: border-color var(--toggle-duration) var(--ease); }
  .deny-input:focus { border-color: var(--rep-500); }

  /* ─── Buttons ─── */
  .btn-primary { display: inline-flex; align-items: center; justify-content: center; padding: 8px 14px; border-radius: var(--r-sm); border: none; background: var(--rep-500); color: var(--on-rep); font-family: inherit; font-size: var(--fs-lg); font-weight: 500; cursor: pointer; white-space: nowrap; filter: drop-shadow(0 2px 4px rgba(80,70,55,0.18)); transition: background var(--toggle-duration) var(--ease); }
  .btn-primary:hover { background: var(--rep-600); }
  .btn-ghost { display: inline-flex; align-items: center; justify-content: center; background: transparent; border: none; color: var(--muted); padding: 6px 10px; border-radius: var(--r-sm); font-family: inherit; font-size: var(--fs-lg); font-weight: 500; cursor: pointer; transition: background var(--toggle-duration) var(--ease), color var(--toggle-duration) var(--ease); }
  .btn-ghost:hover { background: var(--raised); color: var(--fg); }

  /* ─── Audit ─── */
  .audit-path { font-family: var(--font-mono); font-size: 12.5px; color: var(--muted); background: var(--raised); display: inline-block; padding: 5px 10px; border-radius: var(--r-sm); border: 1px solid var(--border-soft); margin-bottom: 12px; }

  /* ─── Dark mode ─── */
  [data-theme="dark"] .nav-item.active { background: var(--halo-rep-settings); }
  [data-theme="dark"] .nav-item.active::before { background: var(--rep-400); filter: drop-shadow(0 0 4px var(--rep-500)); }
  [data-theme="dark"] .segment.active { filter: drop-shadow(0 1px 3px rgba(0,0,0,0.35)); }

</style>
</head>
<body>
<div class="shell">

  <!-- ══════ 顶栏（52px） ══════ -->
  <!-- Slint: HBox { height:52; title | spacer | theme-toggle } -->
  <div class="topbar">
    <div class="topbar-title">设置</div>
    <div class="topbar-spacer"></div>
    <button class="topbar-btn" id="themeToggle" title="切换亮/暗（演示）">◐</button>
  </div>

  <!-- ══════ 窗口控制（右上角） ══════ -->
  <div class="win-ctrl">
    <button class="win-btn" title="最小化"><svg width="12" height="12" viewBox="0 0 12 12"><line x1="2" y1="6" x2="10" y2="6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
    <button class="win-btn" title="最大化"><svg width="12" height="12" viewBox="0 0 12 12"><rect x="2" y="2" width="8" height="8" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.3"/></svg></button>
    <button class="win-btn close" title="关闭"><svg width="12" height="12" viewBox="0 0 12 12"><line x1="3" y1="3" x2="9" y2="9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="9" y1="3" x2="3" y2="9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
  </div>

  <!-- ══════ 品牌水印（左下角） ══════ -->
  <div class="watermark">
    <svg width="14" height="14" viewBox="0 0 240 240"><g fill="none" stroke="#7B766C" stroke-linecap="round"><circle cx="120" cy="120" r="16" stroke-width="6"/><path d="M120 60 A60 60 0 1 1 78 78" stroke-width="8"/><path d="M120 30 A90 90 0 1 1 50 60" stroke-width="10"/></g><line x1="30" y1="120" x2="210" y2="120" stroke="#7B766C" stroke-width="9" stroke-linecap="round"/></svg>
    <span class="bt">northing</span>
  </div>

  <!-- ══════ 内容行（nav | content-body） ══════ -->
  <!-- Slint: HBox { flex:1; nav | content-body } -->
  <div class="content">

    <nav class="nav" aria-label="设置导航">
      <div class="nav-group">
        <div class="nav-group-label">偏好</div>
        <button class="nav-item"><span class="nav-item-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg></span>通用</button>
        <button class="nav-item"><span class="nav-item-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>自我认知</button>
      </div>
      <div class="nav-group">
        <div class="nav-group-label">能力</div>
        <button class="nav-item"><span class="nav-item-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><line x1="9" y1="1" x2="9" y2="4"/><line x1="15" y1="1" x2="15" y2="4"/><line x1="9" y1="20" x2="9" y2="23"/><line x1="15" y1="20" x2="15" y2="23"/><line x1="20" y1="9" x2="23" y2="9"/><line x1="20" y1="14" x2="23" y2="14"/><line x1="1" y1="9" x2="4" y2="9"/><line x1="1" y1="14" x2="4" y2="14"/></svg></span>模型</button>
        <button class="nav-item"><span class="nav-item-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span>工作区</button>
        <button class="nav-item"><span class="nav-item-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg></span>技能</button>
        <button class="nav-item"><span class="nav-item-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg></span>MCP 服务器</button>
      </div>
      <div class="nav-group">
        <div class="nav-group-label">安全</div>
        <button class="nav-item active" aria-current="page"><span class="nav-item-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>访问权限</button>
      </div>
    </nav>

    <main class="content-body">
      <div class="content-inner">
        <!-- Card 1: 自治档 -->
        <section class="card" aria-labelledby="card-autonomy">
          <h2 class="card-title" id="card-autonomy">自治档</h2>
          <div class="segment-group" role="radiogroup" aria-label="自治档选择">
            <button class="segment segment-lg active" role="radio" aria-checked="true" data-value="permissive" data-desc="agent 执行命令不打断你。适合信任的编码模式。">自治·完全</button>
            <button class="segment segment-lg" role="radio" aria-checked="false" data-value="strict" data-desc="每条 shell 命令执行前先问你。">需确认</button>
          </div>
          <p class="seg-desc" aria-live="polite">agent 执行命令不打断你。适合信任的编码模式。</p>
        </section>

        <!-- Card 2: 每模式覆盖 -->
        <section class="card" aria-labelledby="card-overrides">
          <h2 class="card-title" id="card-overrides">每模式覆盖</h2>
          <p class="card-hint">编码相关模式默认完全自治；可为单个模式改档。</p>
          <div class="mode-list" role="list" id="mode-list"></div>
        </section>

        <!-- Card 3: 命令黑名单 -->
        <section class="card" aria-labelledby="card-denylist">
          <h2 class="card-title" id="card-denylist">命令黑名单</h2>
          <p class="card-hint">这些危险命令永远被拦截，无论自治档。</p>

          <button class="deny-expand" id="deny-toggle" aria-expanded="true">
            <span>编辑黑名单</span>
            <span class="chevron" aria-hidden="true" style="transform:rotate(180deg)">▼</span>
          </button>

          <div class="deny-card" aria-label="内置危险命令" style="margin-top:10px;">
            <div class="deny-row"><span class="deny-prefix" aria-hidden="true">•</span><span>rm -rf 危险目标</span></div>
            <div class="deny-row"><span class="deny-prefix" aria-hidden="true">•</span><span>dd of=\.\\physicaldrive</span></div>
            <div class="deny-row"><span class="deny-prefix" aria-hidden="true">•</span><span>mkfs 格式化</span></div>
            <div class="deny-row"><span class="deny-prefix" aria-hidden="true">•</span><span>format c:</span></div>
            <div class="deny-row"><span class="deny-prefix" aria-hidden="true">•</span><span>:(){ :|:& };: fork 炸弹</span></div>
            <div class="deny-row"><span class="deny-prefix" aria-hidden="true">•</span><span>shutdown / reboot</span></div>
          </div>

          <div class="deny-add is-open" id="deny-add">
            <input class="deny-input" id="deny-input" type="text" placeholder="输入命令模式..." aria-label="添加黑名单命令" />
            <button class="btn-primary" id="deny-add-btn">添加</button>
          </div>
        </section>

        <!-- Card 4: 审计日志 -->
        <section class="card" aria-labelledby="card-audit">
          <h2 class="card-title" id="card-audit">审计日志</h2>
          <p class="card-hint">每条 shell 命令的决策（允许 / 拦截 / 确认）都记录在案。</p>
          <div class="audit-path" aria-label="审计日志路径">.northing/audit.log</div>
          <button class="btn-ghost deny-expand" style="margin-top:0">查看审计日志</button>
        </section>
      </div>
    </main>
  </div>
</div>

<script>
  (function() {
    const modes = [
      { id: 'agentic', label: 'agentic', default: 'permissive', current: 'permissive', group: 'active', desc: 'agent 自主执行命令，无需确认' },
      { id: 'debug', label: 'debug', default: 'permissive', current: 'permissive', group: 'active', desc: '调试模式下可直接运行工具' },
      { id: 'cowork', label: 'cowork', default: 'permissive', current: 'permissive', group: 'active', desc: '协作时自动执行共享任务' },
      { id: 'team', label: 'team', default: 'permissive', current: 'permissive', group: 'active', desc: '团队模式下执行协作命令' },
      { id: 'claw', label: 'claw', default: 'permissive', current: 'permissive', group: 'active', desc: 'Claw 工具自动授权执行' },
      { id: 'plan', label: 'plan', default: 'permissive', current: 'permissive', group: 'silent', desc: '计划阶段静默拦截危险操作' },
      { id: 'multitask', label: 'multitask', default: 'permissive', current: 'permissive', group: 'silent', desc: '多任务时静默过滤高风险命令' },
      { id: 'admin', label: 'admin', default: 'permissive', current: 'strict', group: 'silent', desc: '管理操作需逐条确认' },
    ];

    const modeList = document.getElementById('mode-list');

    function renderModes() {
      modeList.innerHTML = '';
      // Active group header
      const activeHeader = document.createElement('div');
      activeHeader.className = 'mode-group-label rep-accent';
      activeHeader.textContent = '主动动作';
      modeList.appendChild(activeHeader);
      modes.filter(m => m.group === 'active').forEach(m => {
        const row = document.createElement('div');
        row.className = 'mode-row';
        row.setAttribute('role', 'listitem');

        const name = document.createElement('span');
        name.className = 'mode-name';
        name.textContent = m.label;

        const microcopy = document.createElement('span');
        microcopy.className = 'mode-microcopy';
        microcopy.textContent = m.desc;

        const seg = document.createElement('div');
        seg.className = 'segment-group';
        seg.setAttribute('role', 'radiogroup');
        seg.setAttribute('aria-label', m.label + ' 自治档');

        ['permissive', 'strict'].forEach(val => {
          const opt = document.createElement('button');
          opt.className = 'segment segment-sm';
          opt.setAttribute('role', 'radio');
          opt.setAttribute('aria-checked', m.current === val ? 'true' : 'false');
          opt.dataset.value = val;
          opt.dataset.mode = m.id;
          opt.textContent = val === 'permissive' ? '完全' : '确认';
          if (m.current === val) opt.classList.add('active');
          opt.addEventListener('click', () => { m.current = val; renderModes(); });
          seg.appendChild(opt);
        });

        row.appendChild(name);
        row.appendChild(microcopy);
        row.appendChild(seg);
        modeList.appendChild(row);
      });
      // Silent group header
      const silentHeader = document.createElement('div');
      silentHeader.className = 'mode-group-label abyss-accent';
      silentHeader.textContent = '静默拦截';
      modeList.appendChild(silentHeader);
      modes.filter(m => m.group === 'silent').forEach(m => {
        const row = document.createElement('div');
        row.className = 'mode-row';
        row.setAttribute('role', 'listitem');

        const name = document.createElement('span');
        name.className = 'mode-name';
        name.textContent = m.label;

        const microcopy = document.createElement('span');
        microcopy.className = 'mode-microcopy';
        microcopy.textContent = m.desc;

        const seg = document.createElement('div');
        seg.className = 'segment-group';
        seg.setAttribute('role', 'radiogroup');
        seg.setAttribute('aria-label', m.label + ' 自治档');

        ['permissive', 'strict'].forEach(val => {
          const opt = document.createElement('button');
          opt.className = 'segment segment-sm';
          opt.setAttribute('role', 'radio');
          opt.setAttribute('aria-checked', m.current === val ? 'true' : 'false');
          opt.dataset.value = val;
          opt.dataset.mode = m.id;
          opt.textContent = val === 'permissive' ? '完全' : '确认';
          if (m.current === val) opt.classList.add('active');
          opt.addEventListener('click', () => { m.current = val; renderModes(); });
          seg.appendChild(opt);
        });

        row.appendChild(name);
        row.appendChild(microcopy);
        row.appendChild(seg);
        modeList.appendChild(row);
      });
    }
    renderModes();

    // Global autonomy segment
    const globalSeg = document.querySelector('.segment-group[aria-label="自治档选择"]');
    const descEl = document.querySelector('.seg-desc');
    globalSeg.addEventListener('click', e => {
      const btn = e.target.closest('.segment');
      if (!btn) return;
      globalSeg.querySelectorAll('.segment').forEach(b => {
        b.classList.remove('active');
        b.setAttribute('aria-checked', 'false');
      });
      btn.classList.add('active');
      btn.setAttribute('aria-checked', 'true');
      descEl.textContent = btn.dataset.desc;
      descEl.style.opacity = '0';
      requestAnimationFrame(() => { descEl.style.opacity = '1'; });
    });

    // Denylist expand
    const toggle = document.getElementById('deny-toggle');
    const addWrap = document.getElementById('deny-add');
    toggle.addEventListener('click', () => {
      const open = addWrap.classList.toggle('is-open');
      toggle.setAttribute('aria-expanded', String(open));
    });

    // Denylist add (demo)
    const input = document.getElementById('deny-input');
    const addBtn = document.getElementById('deny-add-btn');
    addBtn.addEventListener('click', () => {
      const v = input.value.trim();
      if (!v) return;
      const card = document.querySelector('.deny-card');
      const row = document.createElement('div');
      row.className = 'deny-row';
      row.innerHTML = '<span class="deny-prefix" aria-hidden="true">•</span><span>' + v.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</span>';
      card.appendChild(row);
      input.value = '';
    });
    input.addEventListener('keydown', e => { if (e.key === 'Enter') addBtn.click(); });

    // 演示切换钮
    (function(){
      const t = document.getElementById('themeToggle'); if (!t) return;
      const set = m => { m === 'dark' ? document.documentElement.setAttribute('data-theme', 'dark') : document.documentElement.removeAttribute('data-theme'); t.textContent = m === 'dark' ? '◑' : '◐'; };
      let cur = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; set(cur);
      t.addEventListener('click', () => { cur = cur === 'dark' ? 'light' : 'dark'; set(cur); });
    })();
  })();
</script>
</body>
</html>
