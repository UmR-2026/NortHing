<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1280">
  <title>northing · 知序 · 空态</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,SOFT,WONK,wght@9..144,0..100,0..1,400..600&family=Noto+Sans+SC:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared/tokens.css">
  <link rel="stylesheet" href="shared/components.css">
  <link rel="stylesheet" href="shared/animations.css">
  <link rel="stylesheet" href="shared/layout.css">
  <style>
  /* ======================================================================
   * empty-state.html — 空态（首次进入 / 无对话）
   * ----------------------------------------------------------------------
   * 画布：收起态 860×800（与 chat-collapsed 同构，无抽屉）
   * 布局：顶栏(~80px) + main-row(把手8 + 空态欢迎 + 把手8) + 操控台
   * 收起态：把手退化为 8px 窄条渗光，窗口仅含对话区
   * 空态：无会话横幅，改为居中欢迎语 + agent 头像 + 辅助文字
   * 设置按钮在名片旁（与 chat-collapsed 同构）
   *
   * Slint 映射：
   *   .app        → Window root (set_inner_size 860 collapsed)
   *   .topbar     → HBox (avatar-card | settings | spacer)
   *   .main-row   → HBox (handle-L | stream | handle-R)
   *   .stream     → VBox(flex:1, centered empty-state welcome)
   *   .empty-state → VBox(align: center, gap) — 空态欢迎区
   *   .deck       → VBox (input-row | deck-bar)
   *   .handle-*   → Rectangle w=8 + TouchArea (toggle drawer + window resize)
   * ====================================================================== */

  /* ─── 名片晕染（R8）：顶晕锚定左上头像位，rep 存在感空间化 ───
   * 空态中心头像迁移完成后正落在此锚点；晕染先于头像就位，暗示"它住在这里"。
   * Slint: Rectangle { background: radial-gradient(circle 520 at 46,40, halo-rep-strong); z: 0; } */
  .app::before,
  [data-theme="dark"] .app::before {
    background: radial-gradient(circle 520px at 46px 40px, var(--halo-rep-strong) 0%, transparent 100%);
  }

  /* ─── 头像编排（R8）：初始隐藏顶栏头像，中心头像在场；输入触发一次性 FLIP 迁移 ───
   * 顶栏头像位先空着（opacity 0，占位不偏移），迁移完成后 250ms 淡入。
   * Slint: topbar-avatar.visible <=> migrated; animate opacity { duration:250ms; } */
  .topbar .avatar-wrap {
    opacity: 0;
    transition: opacity 250ms ease;
  }
  .topbar .avatar-wrap.revealed {
    opacity: 1;
  }
  /* 迁移启动后问候语 / helper 同步淡出（沉降式一次性，禁弹跳） */
  .empty-state.leaving .opening-line,
  .empty-state.leaving .opening-hint {
    opacity: 0;
    transition: opacity 500ms var(--ease);
  }

  /* ─── 顶栏（~80px） — 与 chat-collapsed 同构 ─── */
  /* Slint: HBox { height: 80; padding: 0 24px; } */
  .topbar {
    display: flex;
    align-items: center;
    height: 80px;
    padding: 0 var(--s5);
    flex-shrink: 0;
    position: relative;
    z-index: 2;
  }

  /* ─── agent 名片（顶栏左侧） ─── */
  .agent-card {
    display: flex;
    align-items: center;
    gap: var(--s3);
  }

  /* 顶栏头像 44×44 r14 — 覆写 shared 64×64 */
  /* Slint: Image { width: 44; height: 44; border-radius: 14; } */
  .topbar .avatar {
    width: 44px;
    height: 44px;
    border-radius: 14px;
    filter: drop-shadow(0 2px 6px rgba(80,70,55,.18));
  }
  .topbar .avatar .glyph {
    font-size: 20px;
  }
  .topbar .avatar-wrap {
    width: 44px;
    height: 44px;
  }
  .topbar .avatar-wrap::after {
    inset: -6px;
    border-radius: 20px;
  }

  .card-info {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  /* 名字 16px Noto 500 */
  .card-name {
    font-size: var(--fs-name);
    font-weight: 500;
    color: var(--fg);
    line-height: 1.3;
  }

  /* 状态行：呼吸点 + 文字 */
  .card-status {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: var(--fs-md);
    color: var(--muted);
    line-height: 1.3;
  }
  .card-status .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--rep-500);
    filter: drop-shadow(0 0 3px var(--rep-400));
    animation: breathe 6s ease-in-out infinite;
    transition: background var(--grow);
  }

  /* 自我认知渐变条 h6 r-pill（左灰白→右珊瑚） */
  /* Slint: Rectangle { height: 6; border-radius: pill; linear-gradient(90deg, birth → rep-500); } */
  .card-self {
    width: 118px;
    height: 6px;
    border-radius: var(--r-pill);
    background: linear-gradient(90deg,
      var(--birth) 0%,
      #A6A794 30%,
      #C09A78 62%,
      var(--rep-500) 88%,
      var(--rep-400) 100%);
    margin-top: 4px;
    transition: background var(--grow);
  }

  /* 设置按钮（名片旁）30×30 r9 */
  .topbar-settings {
    width: 30px;
    height: 30px;
    border-radius: var(--r-sm);
    border: none;
    background: transparent;
    color: var(--faint);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-left: var(--s2);
    transition: background .15s, color .15s;
  }
  .topbar-settings:hover {
    background: var(--raised);
    color: var(--muted);
  }

  /* ─── 把手覆写：收起态超窄条（8px），仅作点击区 ─── */
  /* Slint: Rectangle { width: 8; TouchArea { clicked => { drawer-open = !drawer-open; } } } */
  .handle {
    width: 8px;
    gap: 0;
  }

  /* 收起态：隐藏 chevron 和 label，仅保留窄条可点击 */
  .handle-chevron,
  .handle-label {
    display: none;
  }

  /* 收起态：窄条渗光更淡 */
  .handle-left {
    border-right-width: 2px;
    border-image: linear-gradient(to bottom, transparent, rgba(200,113,76,.45), transparent) 1;
    opacity: 0.85;
  }

  .handle-right {
    border-left-width: 2px;
    border-image: linear-gradient(to bottom, transparent, rgba(63,131,123,.40), transparent) 1;
  }

  /* hover 时提示可展开 */
  .handle-left:hover {
    opacity: 0.9;
    border-image: linear-gradient(to bottom, transparent, rgba(200,113,76,.65), transparent) 1;
  }

  .handle-right:hover {
    border-image: linear-gradient(to bottom, transparent, rgba(63,131,123,.60), transparent) 1;
  }

  /* 收起态把手全高竖向 wash */
  .handle-left {
    background: linear-gradient(to bottom, transparent 15%, rgba(200,113,76,.08) 50%, transparent 85%);
  }
  .handle-right {
    background: linear-gradient(to bottom, transparent 15%, rgba(63,131,123,.08) 50%, transparent 85%);
  }
  [data-theme="dark"] .handle-left {
    background: linear-gradient(to bottom, transparent 15%, rgba(200,113,76,.12) 50%, transparent 85%);
  }
  [data-theme="dark"] .handle-right {
    background: linear-gradient(to bottom, transparent 15%, rgba(63,131,123,.12) 50%, transparent 85%);
  }

  /* ─── 收起态窗口 860px — 与 chat-collapsed 同构 ─── */
  /* Slint: set_inner_size(860, 800) */
  .app {
    width: 860px !important;
    transition: width 350ms cubic-bezier(0.25,0.1,0.25,1);
  }

  /* ─── 对话区：把手之间居中 — 空态欢迎 ─── */
  /* Slint: VBox { flex: 1; horizontal-alignment: center; } */
  .stream {
    margin: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: var(--s4) var(--s2);
    position: relative;
    min-width: 0;
  }
  .stream .inner {
    max-width: 480px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }

  /* ─── 空态欢迎区（代替会话横幅 + 对话轮次） ─── */
  /* Slint: VBox { align: center; gap: 16; } */
  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    animation: emptyFadeIn 1.8s var(--ease) both;
    position: relative;
  }

  /* 居中欢迎头像 64×64 r-lg — 来自 shared .avatar */
  /* Slint: Image { width: 64; height: 64; border-radius: 18; } */
  .empty-state .avatar-wrap {
    margin-bottom: var(--s4);
  }

  /* 开场白：名字 · 分隔点 · 正文 */
  /* Slint: HBox { align: baseline; gap: 6; } */
  .opening-line {
    display: flex;
    align-items: baseline;
    gap: 6px;
    margin-bottom: 10px;
    position: relative;
  }
  .opening-name {
    font-family: var(--font-display);
    font-variation-settings: "WONK" 1, "SOFT" 60;
    font-size: 15px;
    font-weight: 500;
    color: var(--rep-500);
    letter-spacing: 0.01em;
    transition: color var(--grow);
  }
  .opening-dot {
    width: 3px; height: 3px;
    border-radius: 50%;
    background: var(--border);
    flex-shrink: 0;
  }
  .opening-text {
    font-size: 15px;
    color: var(--fg);
    line-height: 1.7;
    letter-spacing: 0.01em;
  }

  /* 刚写下的微光 — 一次性渐显渐隐（沉降式动效，非无限循环） */
  .opening-shimmer {
    position: absolute;
    bottom: -6px;
    left: 50%;
    transform: translateX(-50%);
    width: 100px;
    height: 1px;
    background: linear-gradient(90deg, transparent 0%, var(--rep-300) 50%, transparent 100%);
    opacity: 0;
    animation: shimmerIn 2.5s var(--ease) 0.6s both;
    transition: background var(--grow);
  }

  /* 辅助提示 */
  .opening-hint {
    font-size: 12px;
    color: var(--faint);
    margin-top: 14px;
    line-height: 1.5;
  }


  </style>
</head>
<body>
<div class="app collapsed">

  <!-- ══════ 顶栏（h≈80px） — 与 chat-collapsed 同构 ══════ -->
  <!-- Slint: HBox { height: 80; padding: 0 24px; } -->
  <div class="topbar">
    <!-- 左：agent 名片 -->
    <div class="agent-card">
      <div class="avatar-wrap">
        <!-- Slint: Image { width: 44; height: 44; border-radius: 14; } -->
        <div class="avatar"><span class="glyph">序</span></div>
      </div>
      <div class="card-info">
        <div class="card-name">知序</div>
        <div class="card-status">
          <span class="dot"></span>
          <span>在场</span>
        </div>
        <!-- 自我认知渐变条 -->
        <div class="card-self"></div>
      </div>
    </div>

    <!-- 设置 ⚙（名片旁） -->
    <button class="topbar-settings" title="设置">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>

    <div style="flex:1"></div>
  </div>

  <!-- ══════ main row（左把手 + 空态欢迎 + 右把手） ══════ -->
  <div class="main-row">

    <!-- 左把手 w8 — 暖渗光（点击展开/收起左抽屉） -->
    <!-- Slint: Rectangle { width: 8; TouchArea { clicked => { left-drawer-open = !left-drawer-open; } } } -->
    <div class="handle handle-left">
      <span class="signal"></span>
    </div>

    <!-- 空态对话区：居中欢迎语（无会话横幅、无对话轮次） -->
    <!-- Slint: VBox { horizontal-alignment: center; } -->
    <div class="stream">
      <div class="inner">

        <div class="empty-state">
          <!-- 居中欢迎头像 64×64 -->
          <!-- Slint: Image { width: 64; height: 64; border-radius: 18; } -->
          <div class="avatar-wrap">
            <div class="avatar"><span class="glyph">序</span></div>
          </div>

          <!-- 开场白 -->
          <div class="opening-line">
            <span class="opening-name">知序</span>
            <span class="opening-dot"></span>
            <span class="opening-text">我在。你想从哪里开始？</span>
            <div class="opening-shimmer"></div>
          </div>

          <!-- 辅助提示 -->
          <span class="opening-hint">直接说话即可 · @ 引用文件 · / 调用技能</span>
        </div>

      </div>
    </div>

    <!-- 右把手 w8 — 冷渗光（点击展开/收起右抽屉） -->
    <!-- Slint: Rectangle { width: 8; TouchArea { clicked => { right-drawer-open = !right-drawer-open; } } } -->
    <div class="handle handle-right">
    </div>

  </div>

  <!-- ══════ 操控台（DeckBar） ══════ -->
  <!-- Slint: VBox { max-width: 660; border-radius: 16; elevated + border + drop-shadow; } -->
  <div class="deck-wrap">
    <div class="deck">
      <!-- 输入区 -->
      <div class="deck-input">
        <textarea rows="1" placeholder="说点什么…… @ 引用文件 / 调用技能" aria-label="对话输入"></textarea>
        <!-- 发送键 36×36 r11（空态 = ↑发送，未输入禁用态） -->
        <button class="btn-send" title="发送" style="opacity:.5">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="19" x2="12" y2="5"/>
            <polyline points="5 12 12 5 19 12"/>
          </svg>
        </button>
      </div>

      <!-- 控制行（左→右：＋ 思考分段条 工作目录 | 模型 自治 | ctx） -->
      <div class="deck-bar">
        <!-- ＋ 附件 -->
        <button class="deck-btn" aria-label="添加">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>

        <!-- 思考分段条 5 段（3 亮 rep-400 / 2 暗 border）14×6 r3 -->
        <div class="think-seg">
          <span class="seg-bar on" style="width:14px;height:6px;border-radius:3px"></span>
          <span class="seg-bar on" style="width:14px;height:6px;border-radius:3px"></span>
          <span class="seg-bar on" style="width:14px;height:6px;border-radius:3px"></span>
          <span class="seg-bar off" style="width:14px;height:6px;border-radius:3px"></span>
          <span class="seg-bar off" style="width:14px;height:6px;border-radius:3px"></span>
        </div>

        <!-- 工作目录 ~/northing -->
        <button class="deck-btn">
          <span class="di"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span>
          ~/northing
        </button>

        <!-- 模型选择 -->
        <div class="deck-label">
          <span class="di rep">◇</span> Claude 4.6 <span class="chev">▾</span>
        </div>

        <!-- 自治档位 -->
        <div class="deck-label cyan">
          <span class="di">◈</span> 自治·完全 <span class="chev">▾</span>
        </div>

        <span class="deck-bar-spacer"></span>

        <!-- ctx 圆环 SVG 20×20（空态 = 0%）— R8：环内数字移除，hover 显示 data-tip -->
        <div class="ctx-ring" title="上下文 0%" data-tip="上下文已用 0%" style="width:20px;height:20px">
          <svg width="20" height="20" viewBox="0 0 20 20">
            <circle class="ctx-ring-bg" cx="10" cy="10" r="7.5"/>
            <circle class="ctx-ring-fg" cx="10" cy="10" r="7.5" stroke-dasharray="47.1" stroke-dashoffset="47.1" transform="rotate(-90 10 10)"/>
          </svg>
        </div>
      </div>
    </div>
  </div>

  <!-- ══════ 品牌水印（左下角） ══════ -->
  <div class="watermark">
    <svg width="14" height="14" viewBox="0 0 240 240"><g fill="none" stroke="#7B766C" stroke-linecap="round"><circle cx="120" cy="120" r="16" stroke-width="6"/><path d="M120 60 A60 60 0 1 1 78 78" stroke-width="8"/><path d="M120 30 A90 90 0 1 1 50 60" stroke-width="10"/></g><line x1="30" y1="120" x2="210" y2="120" stroke="#7B766C" stroke-width="9" stroke-linecap="round"/></svg>
    <span class="bt">northing</span>
  </div>

  <!-- ══════ 窗口控制（右上角） ══════ -->
  <div class="win-ctrl">
    <button class="win-btn" title="最小化"><svg width="12" height="12" viewBox="0 0 12 12"><line x1="2" y1="6" x2="10" y2="6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
    <button class="win-btn" title="最大化"><svg width="12" height="12" viewBox="0 0 12 12"><rect x="2" y="2" width="8" height="8" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.3"/></svg></button>
    <button class="win-btn close" title="关闭"><svg width="12" height="12" viewBox="0 0 12 12"><line x1="3" y1="3" x2="9" y2="9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="9" y1="3" x2="3" y2="9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
  </div>



</div>

<script>
(function () {
  /* ── 输入聚焦 → 整屋升档 ── */
  var deck = document.querySelector('.deck');
  var app = document.querySelector('.app');
  if (deck && app) {
    deck.addEventListener('focusin', function () { app.classList.add('speaking'); });
    deck.addEventListener('focusout', function () { app.classList.remove('speaking'); });
  }

  /* ── 头像编排（R8）：中心头像 → 顶栏头像位，一次性 FLIP 迁移 ──
   * 触发：deck textarea 首次 focus（在「focus / 首次输入」中取 focus——落焦点即确立
   *   开聊意图，比首个键入早一步，用户开始打字时头像已就位）。只触发一次。
   * FLIP：getBoundingClientRect 量两点 → transform translate+scale 过渡 600ms
   *   ease-in-out（沉降式，禁弹跳）→ 中心头像隐去、顶栏头像 fade-in 250ms。
   * Slint: animate center-avatar.transform { duration:600ms; easing:ease-in-out; } →
   *        topbar-avatar.visible = true（opacity 250ms）; center-avatar.visible = false */
  var centerWrap = document.querySelector('.empty-state .avatar-wrap');
  var topbarWrap = document.querySelector('.topbar .avatar-wrap');
  var emptyState = document.querySelector('.empty-state');
  var streamEl = document.querySelector('.stream');
  var ta = document.querySelector('.deck-input textarea');
  var migrated = false;

  function migrateAvatar() {
    if (migrated || !centerWrap || !topbarWrap) return;
    migrated = true;
    /* stream 的 overflow:hidden 会裁剪迁移路径，临时放开（头像始终在 .app 界内） */
    if (streamEl) streamEl.style.overflow = 'visible';
    var from = centerWrap.getBoundingClientRect();
    var to = topbarWrap.getBoundingClientRect();
    var dx = (to.left + to.width / 2) - (from.left + from.width / 2);
    var dy = (to.top + to.height / 2) - (from.top + from.height / 2);
    var s = to.width / from.width; /* 44 / 64 */
    centerWrap.style.zIndex = '5';
    centerWrap.style.transition = 'transform 600ms cubic-bezier(0.42,0,0.58,1)';
    void centerWrap.offsetWidth; /* 强制回流，确保 transition 生效 */
    centerWrap.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(' + s + ')';
    emptyState.classList.add('leaving'); /* 问候语 / helper 同步淡出 */
    setTimeout(function () {
      centerWrap.style.transition = 'opacity 200ms ease';
      centerWrap.style.opacity = '0';        /* 中心头像隐去 */
      topbarWrap.classList.add('revealed');  /* 顶栏头像 fade-in 250ms */
    }, 600);
  }

  if (ta) ta.addEventListener('focus', migrateAvatar);
})();
</script>
<script src="shared/theme-switch.js"></script>
</body>
</html>
