[package]
name = "northhing"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "northhing Desktop - consult-room GUI shell"
default-run = "northhing"

[[bin]]
name = "northhing"
path = "src/main.rs"

[dependencies]
# Internal crates
northhing-core = { path = "../../crates/assembly/core", default-features = false, features = ["product-full"] }
northhing-core-types = { path = "../../crates/contracts/core-types" }
northhing-events = { path = "../../crates/contracts/events" }
northhing-agent-dispatch = { path = "../../crates/execution/agent-dispatch" }
northhing-runtime-ports = { path = "../../crates/contracts/runtime-ports" }
northhing-kernel-api = { path = "../../crates/contracts/kernel-api" }
northhing-debug-log = { path = "../../crates/services/debug-log" }

# Async traits
async-trait = { workspace = true }

# Dioxus consult-room desktop shell (pinned to =0.8.0-alpha.1)
dioxus = { version = "=0.8.0-alpha.1", features = ["desktop"] }
dioxus-logger = { version = "=0.8.0-alpha.1" }

# Async runtime
tokio = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }

# Home dir lookup for `~/.northhing/config/app.json`. The desktop app
# resolves this directly because AppSettings lives in the desktop crate
# (per `src/crates/assembly/AGENTS.md` boundary rule: keep platform
# concerns out of shared core).
dirs = { workspace = true }

# Error handling
anyhow = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Utilities
uuid = { workspace = true }
chrono = { workspace = true }
parking_lot = { workspace = true }
once_cell = { workspace = true }
pulldown-cmark = { workspace = true }

# OS keyring for secure API key storage (C3, P1-2)
keyring = { workspace = true }

[dependencies.raw-window-handle]
version = "0.6"
[dependencies.windows]
workspace = true
features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"]

[dev-dependencies]
northhing-test-support = { path = "../../crates/support/test-support" }
